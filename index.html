    const BOUNDS = { minLat: 41.2, maxLat: 51.8, minLon: -5.8, maxLon: 10.8 };

    function project(lat, lon, width = 760, height = 700) {
      const margin = 0.07;
      const availableW = width * (1 - 2 * margin);
      const availableH = height * (1 - 2 * margin);

      const lonNorm = (lon - BOUNDS.minLon) / (BOUNDS.maxLon - BOUNDS.minLon);
      const latMercator = Math.log(Math.tan(Math.PI / 4 + (lat * Math.PI / 180) / 2));
      const minLatMerc = Math.log(Math.tan(Math.PI / 4 + (BOUNDS.minLat * Math.PI / 180) / 2));
      const maxLatMerc = Math.log(Math.tan(Math.PI / 4 + (BOUNDS.maxLat * Math.PI / 180) / 2));
      const latNorm = (latMercator - minLatMerc) / (maxLatMerc - minLatMerc);

      const x = width * margin + lonNorm * availableW;
      const y = height - (height * margin + latNorm * availableH);
      return { x, y };
    }

      const parisPos = paris ? project(paris.lat, paris.lon) : { x: 0, y: 0 };

      return (
        <div className="w-full h-full flex flex-col relative overflow-hidden bg-[#080808]">
          <div className="bg-[#0c0c0c]/90 border-b border-[#1a1a1a] p-2 sm:p-3 shrink-0 z-20 flex items-center justify-between overflow-x-auto custom-scrollbar gap-2">
            <div className="flex items-center gap-1.5 text-xs font-bold text-[#c5a059] tracking-wider shrink-0">
              <Filter className="w-3.5 h-3.5" />
              <span className="hidden sm:inline">Filtrer par série (lot) :</span>
            </div>

            <div className="flex items-center gap-1.5">
              <button onClick={() => setSelectedLotFilter('all')} className={`text-[10px] sm:text-xs font-bold py-1.5 px-3 rounded-lg uppercase shrink-0 ${selectedLotFilter === 'all' ? 'bg-[#c5a059] text-black' : 'bg-[#181818] text-gray-300'}`}>Toutes</button>
              {[1, 2, 3, 4, 5].map((lotNum) => (
                <button key={lotNum} onClick={() => setSelectedLotFilter(lotNum)} className={`text-[10px] sm:text-xs font-bold py-1.5 px-2.5 rounded-lg uppercase shrink-0 ${selectedLotFilter === lotNum ? 'bg-[#c5a059] text-black' : 'bg-[#181818] text-gray-300'}`}>Série {lotNum}</button>
              ))}
            </div>
          </div>

          <div className="flex-1 min-h-0 relative flex items-center justify-center p-0 select-none overflow-hidden w-full h-full">
            <svg viewBox="0 0 760 700" preserveAspectRatio="xMidYMid meet" className="w-full h-full max-w-full max-h-full select-none relative z-10">
              <path d={toPathD(franceCoords)} fill="#0e0e0e" stroke="rgba(197, 160, 89, 0.4)" strokeWidth="2.2" />
              <path d={toPathD(belgiumCoords)} fill="#121212" stroke="rgba(197, 160, 89, 0.3)" strokeDasharray="3,3" strokeWidth="1.8" />
              <path d={connectorPath} fill="none" stroke="rgba(197, 160, 89, 0.5)" strokeWidth="2" strokeDasharray="5,4" />

              {shows.filter((s) => s.isReturnCity && s.id !== 'paris').map((show) => {
                const pos = project(show.lat, show.lon);
                const midX = (pos.x + parisPos.x) / 2;
                const midY = (pos.y + parisPos.y) / 2;
                const dx = parisPos.x - pos.x;
                const dy = parisPos.y - pos.y;
                const norm = Math.hypot(dx, dy) || 1;
                const ctrlX = midX - (dy / norm) * 30;
                const ctrlY = midY + (dx / norm) * 30;
                const arcD = `M ${pos.x},${pos.y} Q ${ctrlX},${ctrlY} ${parisPos.x},${parisPos.y}`;
                if (selectedLotFilter !== 'all' && selectedLotFilter !== show.lot) return null;
                return (
                  <g key={`arc-${show.id}`}>
                    <path d={arcD} fill="none" stroke="#3b82f6" strokeWidth="1.8" strokeDasharray="4,4" className="opacity-70" />
                    <circle r="3" fill="#3b82f6"><animateMotion path={arcD} dur="3.5s" repeatCount="indefinite" /></circle>
                  </g>
                );
              })}

              {shows.map((show) => {
                const pos = project(show.lat, show.lon);
                const offset = labelOffsets[show.city] || { dx: 28, dy: 6, anchor: 'start' };
                let orderLabel = `${show.dates[0].order}`;
                if (show.dates.length > 1) orderLabel = `${show.dates[0].order}-${show.dates[show.dates.length - 1].order}`;
                const isLotMatch = selectedLotFilter === 'all' || selectedLotFilter === show.lot;
                const isSelected = show.id === activeShowId;
                const isNextShow = show.id === nextShowId;

                return (
                  <g key={`node-${show.id}`} onClick={() => onSelectShow(show.id, 0)} className="cursor-pointer group" style={{ opacity: isLotMatch ? 1 : 0.25 }}>
                    <circle cx={pos.x} cy={pos.y} r="34" className="fill-transparent" />
                    <circle cx={pos.x} cy={pos.y} r="24" className={isSelected ? 'fill-[#c5a059]/20 stroke-[#c5a059] stroke-2' : 'fill-[#c5a059]/10 opacity-0 group-hover:opacity-100'} />
                    <line x1={pos.x} y1={pos.y - 10} x2={pos.x} y2={pos.y - 16} stroke="#c5a059" strokeWidth="2" opacity="0.8" />
                    <circle cx={pos.x} cy={pos.y} r="11" className={isSelected ? 'fill-[#c5a059] stroke-white stroke-[3]' : 'fill-[#080808] stroke-[#c5a059] stroke-[3] group-hover:fill-[#c5a059]'} />
                    <circle cx={pos.x} cy={pos.y} r="4" className="fill-white" />

                    <g transform={`translate(${pos.x}, ${pos.y - 28})`}>
                      <rect x={show.dates.length > 1 ? -24 : -16} y="-13" width={show.dates.length > 1 ? 48 : 32} height="26" rx="13" className={isSelected ? 'fill-[#c5a059] stroke-white stroke-[2.5]' : 'fill-[#0c0c0c] stroke-[#c5a059] stroke-[2.5]'} />
                      <text x="0" y="0.5" textAnchor="middle" dominantBaseline="central" className={isSelected ? 'fill-black font-sans font-black text-[15px]' : 'fill-[#c5a059] font-sans font-black text-[15px]'}>{orderLabel}</text>
                    </g>

                    {isNextShow && (
                      <g transform={`translate(${pos.x}, ${pos.y - 48})`}>
                        <rect x="-30" y="-8" width="60" height="16" rx="8" className="fill-amber-500 stroke-amber-300 stroke-1" />
                        <text x="0" y="0.5" textAnchor="middle" dominantBaseline="central" className="fill-black font-sans font-black text-[9px]">Prochaine</text>
                      </g>
                    )}

                    {offset.isMultiline ? (
                      <text x={pos.x + offset.dx} y={pos.y + offset.dy} textAnchor={offset.anchor} style={{ paintOrder: 'stroke fill', stroke: '#080808', strokeWidth: '7px' }} className="fill-gray-100 group-hover:fill-[#e5c17e] font-serif text-[18px] font-black tracking-wider pointer-events-none">
                        <tspan x={pos.x + offset.dx} dy="-10">{offset.line1}</tspan>
                        <tspan x={pos.x + offset.dx} dy="20">{offset.line2}</tspan>
                      </text>
                    ) : (
                      <text x={pos.x + offset.dx} y={pos.y + offset.dy} textAnchor={offset.anchor} style={{ paintOrder: 'stroke fill', stroke: '#080808', strokeWidth: '7px' }} className="fill-gray-100 group-hover:fill-[#e5c17e] font-serif text-[19px] font-black tracking-wider pointer-events-none">{show.city}</text>
                    )}
                  </g>
                );
              })}
            </svg>
          </div>
        </div>
      );
    }

    // --- SHOW DETAIL DRAWER COMPONENT ---
    function ShowDetailDrawer({ shows, activeShowId, selectedSubDateIndex, setSelectedSubDateIndex, onClose, permanents, userRole }) {
      const [activeTab, setActiveTab] = useState('exclusive');
      const [showLogisticsDetails, setShowLogisticsDetails] = useState(false);
      const [weather, setWeather] = useState(null);

      if (!activeShowId) return null;
      const show = shows.find((s) => s.id === activeShowId);
      if (!show) return null;

      const dateData = show.dates[selectedSubDateIndex] || show.dates[0];
      const percent = Math.round((dateData.sold / dateData.capacity) * 100);

      useEffect(() => {
        if (!show || !dateData) return;
        setWeather(null);
        fetch(`https://api.open-meteo.com/v1/forecast?latitude=${show.lat}&longitude=${show.lon}&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=Europe/Paris&start_date=${dateData.dateISO}&end_date=${dateData.dateISO}`)
          .then((res) => res.json())
          .then((data) => {
            if (data.daily && data.daily.temperature_2m_max && data.daily.temperature_2m_max.length > 0) {
              setWeather({
                max: data.daily.temperature_2m_max[0],
                min: data.daily.temperature_2m_min[0],
                code: data.daily.weathercode[0],
              });
            } else {
              setWeather(null);
            }
          })
          .catch(() => setWeather(null));
      }, [activeShowId, selectedSubDateIndex]);

      const openDirections = () => {
        window.open(`https://www.google.com/maps/dir/?api=1&destination=${show.lat},${show.lon}`, '_blank');
      };

      const handleReportIssue = () => {
        const message = `Imprévu — ${show.city} (${dateData.date}) : `;
        const phone = (dateData.contact?.phone || "0601770676").replace(/\s/g, '');
        const url = `sms:${phone}?body=${encodeURIComponent(message)}`;
        window.location.href = url;
      };

      const downloadICS = () => {
        const escapeICS = (text) => (text || '').replace(/,/g, '\\,').replace(/;/g, '\\;');
        const startDate = new Date(`${dateData.dateISO}T${dateData.time.replace('h', ':')}:00`);
        const endDate = new Date(startDate.getTime() + 3 * 60 * 60 * 1000);
        const formatICSDate = (d) =>
          `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}T${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}00`;
        const dtStart = formatICSDate(startDate);
        const dtEnd = formatICSDate(endDate);

        const icsContent = [
          'BEGIN:VCALENDAR',
          'VERSION:2.0',
          'PRODID:-//Legend Tour 2026//FR',
          'BEGIN:VEVENT',
          `SUMMARY:${escapeICS(`Legend Tour 2026 — ${show.city}`)}`,
          `LOCATION:${escapeICS(dateData.venue)}`,
          `DTSTART:${dtStart}`,
          `DTEND:${dtEnd}`,
          'BEGIN:VALARM',
          'TRIGGER:-PT2H',
          'ACTION:DISPLAY',
          'DESCRIPTION:Rappel Legend Tour 2026',
          'END:VALARM',
          'END:VEVENT',
          'END:VCALENDAR'
        ].join('\r\n');

        const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = window.URL.createObjectURL(blob);
        link.setAttribute('download', `Legend_Tour_${show.city}.ics`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      return (
        <div className="fixed inset-x-0 bottom-0 z-40 max-h-[calc(100dvh-75px)] sm:max-h-[80vh] lg:max-h-none lg:inset-x-auto lg:top-16 lg:left-4 lg:bottom-4 lg:w-[420px] bg-[#0a0a0a] border-t lg:border border-[#222222] rounded-t-3xl lg:rounded-2xl flex flex-col shrink-0 shadow-2xl overflow-hidden">
          <div className="p-3 bg-[#121212] border-b border-[#222222] flex items-center justify-between shrink-0">
            <span className="text-[10px] font-bold text-[#c5a059] uppercase tracking-widest bg-[#181818] border border-[#333333] px-2.5 py-1 rounded-full">
              Étape #{dateData.order} • Série {show.series}
            </span>
            <button onClick={onClose} className="text-xs font-bold text-gray-400 hover:text-white uppercase flex items-center gap-1 p-1 rounded-lg">
              <X className="w-4 h-4" /><span>Fermer</span>
            </button>
          </div>

          <div className="flex-1 overflow-y-auto custom-scrollbar p-4 sm:p-5 space-y-5 bg-[#0a0a0a]">
            <div className="bg-[#121212] border border-[#222222] rounded-2xl p-4 space-y-4">
              <div className="flex items-start justify-between border-b border-[#222222] pb-3">
                <div>
                  <span className="text-[10px] font-bold text-[#c5a059] tracking-wider block mb-1">Série {show.series}</span>
                  <h2 className="font-serif text-2xl font-black text-white">{show.city}</h2>
                </div>
                <div className="text-right">
                  <p className="text-xs font-extrabold text-[#c5a059]">{dateData.date}</p>
                  <p className="text-xs text-gray-300 font-bold mt-0.5 flex items-center justify-end gap-1"><Clock className="w-3 h-3 text-amber-500"/>{dateData.time}</p>
                </div>
              </div>

              {show.dates.length > 1 && (
                <div className="bg-[#181818] p-2 rounded-xl border border-[#262626] space-y-1">
                  <p className="text-[9px] uppercase text-gray-400 font-bold">Multi-représentations :</p>
                  <div className="flex gap-2">
                    {show.dates.map((d, index) => (
                      <button key={index} onClick={() => setSelectedSubDateIndex(index)} className={`flex-1 py-1.5 text-[10px] font-bold uppercase rounded-lg ${index === selectedSubDateIndex ? 'bg-[#c5a059] text-black' : 'bg-[#202020] text-gray-300'}`}>
                        Représentation #{d.order}
                      </button>
                    ))}
                  </div>
                </div>
              )}

              <div className="space-y-3">
                <div className="flex items-center gap-3">
                  <MapPin className="w-5 h-5 text-[#c5a059] shrink-0" />
                  <div>
                    <p className="text-[9px] uppercase text-gray-400 font-bold">Salle</p>
                    <p className="text-xs text-gray-100 font-bold">{dateData.venue}</p>
                  </div>
                </div>

                {weather && (
                  <div className="bg-[#181818] p-2.5 rounded-xl border border-[#262626] flex items-center justify-between text-xs">
                    <div className="flex items-center gap-2">
                      <span className="text-[#c5a059] font-bold">Météo prévue :</span>
                      <span className="text-gray-200">{weatherCodeToLabel(weather.code)}</span>
                    </div>
                    <span className="font-extrabold text-[#c5a059]">
                      {Math.round(weather.min)}° / {Math.round(weather.max)}°
                    </span>
                  </div>
                )}

                <div className="flex items-center gap-3 bg-[#181818] p-2.5 rounded-xl border border-[#262626]">
                  <Train className="w-4 h-4 text-[#c5a059] shrink-0" />
                  <div>
                    <p className="text-[9px] uppercase text-gray-400 font-bold">Transport prévu</p>
                    <p className="text-xs text-gray-200 font-bold">{show.transport}</p>
                  </div>
                </div>

                <div className="bg-[#161616] p-3 rounded-xl border border-[#262626] space-y-2">
                  <div className="flex justify-between text-[10px]">
                    <span className="font-bold text-gray-400 uppercase">Remplissage</span>
                    <span className="font-extrabold text-[#c5a059]">{percent}%</span>
                  </div>
                  <div className="w-full bg-[#080808] h-2.5 rounded-full overflow-hidden border border-[#222222]">
                    <div className="bg-gradient-to-r from-[#8e6f3b] to-[#c5a059] h-full rounded-full" style={{ width: `${percent}%` }} />
                  </div>
                  <p className="text-[11px] text-gray-300 font-medium">{dateData.sold.toLocaleString('fr-FR')} / {dateData.capacity.toLocaleString('fr-FR')} places</p>
                </div>

                <button onClick={openDirections} className="w-full flex items-center justify-center gap-2 bg-[#181818] border border-[#c5a059] text-white py-3 px-4 rounded-xl text-xs font-extrabold">
                  <Compass className="w-4 h-4 text-emerald-400" /><span>Obtenir l'itinéraire vers la salle</span>
                </button>

                <button onClick={handleReportIssue} className="w-full flex items-center justify-center gap-2 bg-[#181818] border border-[#333333] hover:border-[#c5a059] text-gray-200 py-2.5 px-4 rounded-xl text-xs font-bold transition-colors">
                  <Phone className="w-4 h-4 text-amber-400" /><span>Signaler un imprévu</span>
                </button>

                <button onClick={downloadICS} className="w-full flex items-center justify-center gap-2 bg-[#141414] border border-[#262626] text-[#c5a059] py-2.5 px-4 rounded-xl text-xs font-bold">
                  <Download className="w-4 h-4" /><span>Ajouter au calendrier (.ics)</span>
                </button>

                {/* Logistique & Backstage - Accessible uniquement en mode Tech/Régie */}
                {userRole === 'tech' && (
                  <div className="bg-[#161616] rounded-xl border border-[#262626] overflow-hidden">
                    <button onClick={() => setShowLogisticsDetails(!showLogisticsDetails)} className="w-full p-3 font-bold text-xs text-gray-300 uppercase flex items-center justify-between">
                      <span className="flex items-center gap-2"><Truck className="w-4 h-4 text-[#c5a059]" /><span>Logistique & Backstage</span></span>
                      <ChevronDown className={`w-4 h-4 transition-transform ${showLogisticsDetails ? 'rotate-180' : ''}`} />
                    </button>

                    {showLogisticsDetails && (
                      <div className="p-3 border-t border-[#262626] space-y-2 text-xs bg-[#121212]">
                        {dateData.loadIn && (
                          <div className="flex justify-between bg-[#1a1a1a] p-2 rounded border border-[#262626]">
                            <span className="text-gray-400">Load-in :</span>
                            <span className="font-bold text-amber-400">{dateData.loadIn}</span>
                          </div>
                        )}
                        {dateData.contact && (
                          <div className="bg-[#1a1a1a] p-2 rounded border border-[#262626] space-y-1">
                            <p className="text-[10px] text-gray-400 font-bold uppercase">Régisseur Référent :</p>
                            <p className="font-bold text-white select-text">{dateData.contact.name} ({dateData.contact.role})</p>
                            <a href={`tel:${dateData.contact.phone.replace(/\s/g, '')}`} className="text-[#c5a059] font-bold text-xs flex items-center gap-1 select-text">
                              <Phone className="w-3 h-3" /><span>{dateData.contact.phone}</span>
                            </a>
                          </div>
                        )}
                        {dateData.contactBackup && (
                          <div className="bg-[#1a1a1a] p-2 rounded border border-[#262626] space-y-1">
                            <p className="text-[10px] text-gray-400 font-bold uppercase">Contact de secours :</p>
                            <p className="font-bold text-white select-text">{dateData.contactBackup.name} ({dateData.contactBackup.role})</p>
                            {dateData.contactBackup.phone !== "À compléter" ? (
                              <a href={`tel:${dateData.contactBackup.phone.replace(/\s/g, '')}`} className="text-[#c5a059] font-bold text-xs flex items-center gap-1 select-text">
                                <Phone className="w-3 h-3" /><span>{dateData.contactBackup.phone}</span>
                              </a>
                            ) : (
                              <p className="text-gray-400 text-xs font-bold select-text">{dateData.contactBackup.phone}</p>
                            )}
                          </div>
                        )}
                        {dateData.parkingNotes && (
                          <div className="bg-[#1a1a1a] p-2 rounded border border-[#262626]">
                            <p className="text-[10px] text-gray-400 font-bold uppercase">Parking :</p>
                            <p className="text-xs text-gray-300 select-text">{dateData.parkingNotes}</p>
                          </div>
                        )}
                        {dateData.wifiBackstage && (
                          <div className="bg-[#1a1a1a] p-2 rounded border border-[#262626]">
                            <p className="text-[10px] text-gray-400 font-bold uppercase">Wi-Fi :</p>
                            <p className="font-mono text-xs text-emerald-400 select-text">SSID: {dateData.wifiBackstage.ssid}</p>
                            <p className="font-mono text-xs text-gray-200 select-text">PASS: {dateData.wifiBackstage.password}</p>
                          </div>
                        )}
                      </div>
                    )}
                  </div>
                )}
              </div>
            </div>

            <div className="space-y-3">
              <div className="flex border-b border-[#222222]">
                <button onClick={() => setActiveTab('exclusive')} className={`flex-1 pb-3 text-center text-xs font-bold border-b-2 ${activeTab === 'exclusive' ? 'border-[#c5a059] text-[#c5a059]' : 'border-transparent text-gray-400'}`}>Invités d'honneur</button>
                <button onClick={() => setActiveTab('permanents')} className={`flex-1 pb-3 text-center text-xs font-bold border-b-2 ${activeTab === 'permanents' ? 'border-[#c5a059] text-[#c5a059]' : 'border-transparent text-gray-400'}`}>Intervenants permanents</button>
              </div>

              {activeTab === 'exclusive' && (
                <div className="space-y-2">
                  {dateData.guests.length === 0 ? <p className="text-xs text-gray-400 text-center py-4">Pas d'invité ponctuel annoncé.</p> : dateData.guests.map((g, idx) => (
                    <div key={idx} className="bg-[#141414] border border-[#262626] p-3 rounded-xl flex items-center justify-between">
                      <span className="text-xs font-bold text-white">{g}</span>
                      <Star className="w-4 h-4 text-[#c5a059]" />
                    </div>
                  ))}
                </div>
              )}

              {activeTab === 'permanents' && (
                <div className="space-y-2">
                  {permanents.map((p, idx) => (
                    <div key={idx} className="bg-[#141414] border border-[#262626] p-3 rounded-xl space-y-1">
                      <p className="text-xs font-bold text-white">{p.name}</p>
                      <p className="text-[10px] font-bold text-[#c5a059] uppercase">{p.role}</p>
                      <p className="text-[10px] text-gray-400">{p.desc}</p>
                    </div>
                  ))}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    // --- TRANSPORT HUB COMPONENT ---
    function TransportHub({ seriesData, onSelectShow }) {
      const [selectedSeriesId, setSelectedSeriesId] = useState('all');
      const [modeFilter, setModeFilter] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [copied, setCopied] = useState(false);

      const getFilteredLegs = () => {
        let allLegs = [];
        seriesData.forEach((s) => {
          if (selectedSeriesId === 'all' || s.seriesId === selectedSeriesId) {
            s.legs.forEach((l) => allLegs.push({ series: s, leg: l }));
          }
        });
        if (modeFilter !== 'all') allLegs = allLegs.filter((i) => i.leg.mode === modeFilter);
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase().trim();
          allLegs = allLegs.filter((i) => i.leg.from.toLowerCase().includes(q) || i.leg.to.toLowerCase().includes(q) || i.leg.details.toLowerCase().includes(q));
        }
        return allLegs;
      };

      const filteredItems = getFilteredLegs();

      const handleCopySchedule = () => {
        let text = "Plan de Route & Transports — Legend Tour 2026\n\n";
        seriesData.forEach((s) => {
          text += `=== ${s.title} (${s.datesRange}) ===\n`;
          s.legs.forEach((leg) => {
            text += `${leg.date} | ${leg.from} -> ${leg.to}${leg.mode && leg.mode !== 'local' && leg.mode !== 'car' ? ` | Mode: ${leg.mode.toUpperCase()}` : ''} | ${leg.details}\n`;
          });
          text += "\n";
        });
        navigator.clipboard.writeText(text);
        setCopied(true);
        setTimeout(() => setCopied(false), 3000);
      };

      return (
        <div className="flex-1 min-h-0 flex flex-col bg-[#080808] text-gray-100 overflow-y-auto custom-scrollbar p-3 sm:p-6 space-y-6">
          <div className="bg-[#121212] border border-[#222] rounded-2xl p-4 sm:p-6 box-glow-gold space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-3 border-b border-gray-800 pb-4">
              <div>
                <span className="text-[10px] font-bold text-[#c5a059] tracking-widest bg-[#181818] border border-[#c5a059]/30 px-3 py-1 rounded-full uppercase">Document officiel de route</span>
                <h2 className="font-serif text-2xl sm:text-3xl font-black text-white mt-2">Plan de route & transports (Séries 1 à 6)</h2>
                <p className="text-xs text-gray-400 mt-1">Suivi détaillé des TGV, gares de départ/arrivée, vans et jours OFF.</p>
              </div>
              <button onClick={handleCopySchedule} className="flex items-center gap-2 bg-[#181818] border border-[#c5a059]/50 text-[#c5a059] px-4 py-2.5 rounded-xl text-xs font-bold">
                {copied ? <Check className="w-4 h-4 text-emerald-400" /> : <Copy className="w-4 h-4" />}
                <span>{copied ? 'Feuille copiée !' : 'Copier le planning'}</span>
              </button>
            </div>

            <div className="flex items-center gap-2 overflow-x-auto custom-scrollbar pb-1">
              <button onClick={() => setSelectedSeriesId('all')} className={`py-2 px-3.5 rounded-xl text-xs font-bold ${selectedSeriesId === 'all' ? 'bg-[#c5a059] text-black' : 'bg-[#181818] text-gray-300'}`}>Toutes les séries</button>
              {seriesData.map((s) => (
                <button key={s.seriesId} onClick={() => setSelectedSeriesId(s.seriesId)} className={`py-2 px-3.5 rounded-xl text-xs font-bold uppercase shrink-0 ${selectedSeriesId === s.seriesId ? 'bg-[#c5a059] text-black' : 'bg-[#181818] text-gray-300'}`}>Série {s.seriesId}</button>
              ))}
            </div>

            <div className="flex flex-wrap items-center justify-between gap-3 pt-2 bg-[#0a0a0a] p-3 rounded-xl border border-gray-800">
              <div className="flex items-center gap-2 flex-wrap">
                <button onClick={() => setModeFilter('all')} className={`text-[10px] font-bold px-2.5 py-1 rounded-lg uppercase ${modeFilter === 'all' ? 'bg-[#c5a059] text-black' : 'bg-[#181818] text-gray-400'}`}>Tous</button>
                <button onClick={() => setModeFilter('train')} className={`text-[10px] font-bold px-2.5 py-1 rounded-lg uppercase ${modeFilter === 'train' ? 'bg-purple-500 text-white' : 'bg-[#181818] text-gray-400'}`}>Trains</button>
                <button onClick={() => setModeFilter('van')} className={`text-[10px] font-bold px-2.5 py-1 rounded-lg uppercase ${modeFilter === 'van' ? 'bg-amber-500 text-black' : 'bg-[#181818] text-gray-400'}`}>Vans</button>
              </div>
              <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Chercher gare, ville, N° TGV..." className="bg-[#141414] text-xs text-gray-200 px-3 py-1.5 rounded-lg border border-gray-800" />
            </div>
          </div>

          <div className="space-y-4">
            {filteredItems.map(({ series, leg }) => {
              return (
                <div key={leg.id} className="bg-[#121212] border border-gray-800 rounded-2xl p-4 space-y-3">
                  <div className="flex items-center justify-between border-b border-gray-800 pb-2">
                    <div className="flex items-center gap-2">
                      <span className="text-xs font-extrabold text-white bg-[#181818] px-3 py-1 rounded-lg border border-gray-800">{leg.date}</span>
                      {leg.mode && leg.mode !== 'local' && leg.mode !== 'car' && (
                        <span className={`text-[10px] font-extrabold uppercase px-2.5 py-1 rounded-full ${
                          leg.mode === 'train' ? 'bg-purple-950 text-purple-300 border border-purple-800' :
                          leg.mode === 'van' ? 'bg-amber-950 text-amber-300 border border-amber-800' :
                          leg.mode === 'plane' ? 'bg-sky-950 text-sky-300 border border-sky-800' :
                          'bg-[#202020] text-gray-300 border border-gray-700'
                        }`}>
                          {leg.mode.toUpperCase()}
                        </span>
                      )}
                    </div>
                    {leg.relatedShowId && (
                      <button onClick={() => onSelectShow(leg.relatedShowId)} className="text-[10px] font-bold text-[#c5a059] flex items-center gap-1 bg-[#181818] px-2.5 py-1 rounded-lg border border-[#c5a059]/30">
                        <span>Fiche Show</span><ArrowRight className="w-3 h-3" />
                      </button>
                    )}
                  </div>

                  <div className="flex items-center gap-2 text-sm font-serif font-black text-white">
                    <span>{leg.from}</span><ArrowRight className="w-4 h-4 text-[#c5a059]" /><span>{leg.to}</span>
                  </div>
                  <p className="text-xs text-[#c5a059] font-bold">{leg.details}</p>

                  <div className="bg-[#161616] p-3 rounded-xl border border-gray-800 space-y-2 text-xs">
                    {leg.trainNumber && (
                      <p className="text-purple-300 font-bold text-xs select-text">
                        🚆 <span className="select-text">{leg.trainNumber}</span>
                      </p>
                    )}
                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                      <div className="bg-black/40 p-2.5 rounded-lg space-y-1">
                        <p className="text-[9px] text-gray-400 font-bold uppercase">Départ</p>
                        <p className="font-bold text-white text-xs select-text">{leg.departureStation || leg.from}</p>
                        {leg.departureTime && <p className="text-xs text-[#c5a059] font-bold select-text">{leg.departureTime}</p>}
                        {leg.mode === 'train' && (
                          <a href={`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(leg.departureStation || leg.from)}`} target="_blank" rel="noopener noreferrer" className="flex items-center justify-center gap-1.5 bg-purple-900/60 hover:bg-purple-800 text-purple-100 py-1.5 px-2.5 rounded-lg text-[11px] font-bold border border-purple-700/60 mt-1">
                            <Navigation className="w-3 h-3"/><span>Itinéraire gare de départ</span><ExternalLink className="w-2.5 h-2.5"/>
                          </a>
                        )}
                      </div>

                      <div className="bg-black/40 p-2.5 rounded-lg space-y-1">
                        <p className="text-[9px] text-gray-400 font-bold uppercase">Arrivée</p>
                        <p className="font-bold text-white text-xs select-text">{leg.arrivalStation || leg.to}</p>
                        {leg.arrivalTime && <p className="text-xs text-[#c5a059] font-bold select-text">{leg.arrivalTime}</p>}
                        {leg.mode === 'train' && (
                          <a href={`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(leg.arrivalStation || leg.to)}`} target="_blank" rel="noopener noreferrer" className="flex items-center justify-center gap-1.5 bg-[#222] hover:bg-[#333] text-gray-200 py-1.5 px-2.5 rounded-lg text-[11px] font-bold border border-gray-700 mt-1">
                            <MapPin className="w-3 h-3 text-[#c5a059]"/><span>Itinéraire gare d'arrivée</span><ExternalLink className="w-2.5 h-2.5"/>
                          </a>
                        )}
                      </div>
                    </div>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      const [isUnlocked, setIsUnlocked] = useState(false);
      const [accessCodeInput, setAccessCodeInput] = useState('');
      const [accessError, setAccessError] = useState(false);

      const [activeView, setActiveView] = useState('home');
      const [userRole, setUserRole] = useState('artiste');
      const [activeShowId, setActiveShowId] = useState('bordeaux');
      const [selectedSubDateIndex, setSelectedSubDateIndex] = useState(0);
      const [selectedLotFilter, setSelectedLotFilter] = useState('all');
      const [drawerOpen, setDrawerOpen] = useState(true);

      const [globalSearchOpen, setGlobalSearchOpen] = useState(false);
      const [globalSearchQuery, setGlobalSearchQuery] = useState('');

      useEffect(() => {
        if (sessionStorage.getItem('legend_tour_unlocked') === 'true') {
          setIsUnlocked(true);
        }
      }, []);

      const handleUnlock = () => {
        if (accessCodeInput.trim() === ACCESS_CODE) {
          sessionStorage.setItem('legend_tour_unlocked', 'true');
          setIsUnlocked(true);
          setAccessError(false);
        } else {
          setAccessError(true);
        }
      };

      const getNextShow = () => {
        const todayStr = new Date().toISOString().split('T')[0];
        const upcoming = [];
        SHOWS.forEach((show) => {
          show.dates.forEach((d, idx) => {
            if (d.dateISO >= todayStr) upcoming.push({ show, dateEntry: d, subDateIndex: idx });
          });
        });
        upcoming.sort((a, b) => a.dateEntry.dateISO.localeCompare(b.dateEntry.dateISO));
        if (upcoming.length > 0) return { ...upcoming[0], isFinished: false };
        const lastShow = SHOWS[SHOWS.length - 1];
        return { show: lastShow, dateEntry: lastShow.dates[lastShow.dates.length - 1], subDateIndex: lastShow.dates.length - 1, isFinished: true };
      };

      const getUpcomingShows = (count = 3) => {
        const todayStr = new Date().toISOString().split('T')[0];
        const upcoming = [];
        SHOWS.forEach((show) => {
          show.dates.forEach((d, idx) => {
            if (d.dateISO >= todayStr) upcoming.push({ show, dateEntry: d, subDateIndex: idx });
          });
        });
        upcoming.sort((a, b) => a.dateEntry.dateISO.localeCompare(b.dateEntry.dateISO));
        return upcoming.slice(0, count);
      };

      const nextShowData = getNextShow();
      const upcomingList = getUpcomingShows(3);

      useEffect(() => {
        if (nextShowData.show) {
          setActiveShowId(nextShowData.show.id);
          setSelectedSubDateIndex(nextShowData.subDateIndex);
        }
      }, []);

      const handleSetView = (view) => {
        if (view === 'map') setDrawerOpen(false);
        setActiveView(view);
      };

      const handleSelectShow = (showId, subDateIndex = 0) => {
        setActiveShowId(showId);
        setSelectedSubDateIndex(subDateIndex);
        setDrawerOpen(true);
        setActiveView('map');
      };

      const activeShow = SHOWS.find((s) => s.id === activeShowId);

      const globalSearchResults = globalSearchQuery.trim().length > 0
        ? SHOWS.filter((s) =>
            s.city.toLowerCase().includes(globalSearchQuery.toLowerCase()) ||
            s.dates.some((d) => d.venue.toLowerCase().includes(globalSearchQuery.toLowerCase()))
          )
        : [];

      if (!isUnlocked) {
        return (
          <div className="bg-[#080808] text-gray-100 font-sans h-[100dvh] w-full flex flex-col items-center justify-center p-4 sm:p-6 text-center select-none relative overflow-hidden">
            <div className="relative py-4 flex flex-col items-center justify-center w-full max-w-sm mb-6">
              <div className="flex items-center justify-center gap-2 sm:gap-3">
                <span className="font-sans font-black text-3xl sm:text-5xl tracking-[0.06em] text-white drop-shadow-[0_2px_12px_rgba(255,255,255,0.2)]">
                  LEGEND
                </span>
                <span className="font-sans font-black text-3xl sm:text-5xl tracking-[0.06em] text-transparent bg-clip-text bg-gradient-to-r from-[#f0d59e] via-[#c5a059] to-[#9a7b41] drop-shadow-[0_2px_12px_rgba(197,160,89,0.3)]">
                  TOUR
                </span>
              </div>
              <div className="mt-2 flex items-center gap-2">
                <span className="h-[1px] w-6 bg-gradient-to-r from-transparent to-[#c5a059]/60" />
                <span className="text-[10px] sm:text-xs font-bold uppercase tracking-[0.25em] text-[#c5a059]">
                  by Trade Republic
                </span>
                <span className="h-[1px] w-6 bg-gradient-to-l from-transparent to-[#c5a059]/60" />
              </div>
            </div>

            <div className="bg-[#121212] border border-gray-800 rounded-2xl p-6 max-w-sm w-full space-y-4 shadow-2xl box-glow-gold">
              <div className="flex items-center justify-center gap-2 text-xs font-bold text-gray-400 uppercase tracking-widest">
                <Lock className="w-4 h-4 text-[#c5a059]" />
                <span>Accès Équipe & Invités</span>
              </div>

              <div className="space-y-2">
                <input
                  type="password"
                  value={accessCodeInput}
                  onChange={(e) => {
                    setAccessCodeInput(e.target.value);
                    if (accessError) setAccessError(false);
                  }}
                  onKeyDown={(e) => {
                    if (e.key === 'Enter') handleUnlock();
                  }}
                  placeholder="Code d'accès équipe"
                  className="w-full bg-[#181818] text-center text-sm font-bold text-white px-4 py-3 rounded-xl border border-gray-800 focus:border-[#c5a059] focus:outline-none transition-colors"
                  autoFocus
                />
                {accessError && (
                  <p className="text-xs font-bold text-red-500">Code incorrect</p>
                )}
              </div>

              <button
                onClick={handleUnlock}
                className="w-full text-xs font-black uppercase tracking-wider text-black bg-[#c5a059] hover:bg-[#e5c17e] py-3 px-4 rounded-xl transition-all shadow-lg active:scale-95"
              >
                Accéder
              </button>
            </div>
          </div>
        );
      }

      return (
        <div className="bg-[#080808] text-gray-100 font-sans h-[100dvh] w-full overflow-hidden flex flex-col select-none">
          {/* Header */}
          <header className="bg-[#0c0c0c] border-b border-[#1c1c1c] sticky top-0 shrink-0 z-50 shadow-2xl">
            <div className="bg-[#141414] border-b border-gray-800/80 px-3 py-1 flex items-center justify-between text-[10px] font-bold text-gray-400 gap-2">
              <div className="flex items-center gap-1.5 uppercase tracking-widest text-gray-400">
                <Lock className="w-3 h-3 text-amber-500 shrink-0" />
                <span>Usage interne • Logistique & transports Legend Tour 2026</span>
              </div>
            </div>

            <div className="px-3 sm:px-4 py-2 flex flex-wrap items-center justify-between gap-2">
              <div onClick={() => handleSetView('home')} className="flex items-center gap-2 cursor-pointer group shrink-0">
                <div className="w-8 h-8 sm:w-9 sm:h-9 rounded-full bg-gradient-to-br from-[#8e6f3b] via-[#c5a059] to-[#e5c17e] p-0.5 shadow-lg group-hover:scale-105 transition-transform shrink-0">
                  <div className="w-full h-full bg-[#0a0a0a] rounded-full flex items-center justify-center">
                    <span className="font-serif font-black text-[#c5a059] text-xs sm:text-sm">L</span>
                  </div>
                </div>
                <div className="flex flex-col">
                  <div className="flex items-center gap-1 font-sans font-black tracking-widest text-xs sm:text-sm">
                    <span className="text-white">LEGEND</span>
                    <span className="text-transparent bg-clip-text bg-gradient-to-r from-[#e5c17e] to-[#c5a059]">TOUR</span>
                  </div>
                  <p className="text-[8px] sm:text-[9px] text-[#c5a059] font-bold uppercase tracking-widest flex items-center gap-1">
                    <span>by Trade Republic</span>
                  </p>
                </div>
              </div>

              {/* Mode Selector */}
              <div className="hidden lg:flex items-center bg-[#111] p-1 rounded-xl border border-gray-800 text-[10px] font-bold">
                <span className="text-[9px] text-gray-500 uppercase tracking-wider px-2">Mode :</span>
                <button onClick={() => setUserRole('artiste')} className={`px-2.5 py-1 rounded-lg transition-all ${userRole === 'artiste' ? 'bg-[#c5a059] text-black font-extrabold' : 'text-gray-400'}`}>VIP / Artiste</button>
                <button onClick={() => setUserRole('tech')} className={`px-2.5 py-1 rounded-lg transition-all ${userRole === 'tech' ? 'bg-[#c5a059] text-black font-extrabold' : 'text-gray-400'}`}>Tech / Régie</button>
              </div>

              {/* Search + 3 Main View Tabs */}
              <div className="flex items-center gap-1.5 shrink-0">
                <button
                  onClick={() => setGlobalSearchOpen(!globalSearchOpen)}
                  className={`p-2 rounded-xl border transition-all ${
                    globalSearchOpen
                      ? 'bg-[#c5a059] text-black border-[#c5a059]'
                      : 'bg-[#141414] text-gray-400 hover:text-white border-gray-800'
                  }`}
                  title="Rechercher une ville ou une salle"
                >
                  <Search className="w-4 h-4" />
                </button>

                <div className="flex items-center bg-[#141414] p-1 rounded-xl border border-gray-800 shrink-0">
                  <button onClick={() => handleSetView('home')} className={`flex items-center gap-1 sm:gap-1.5 px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${activeView === 'home' ? 'bg-[#c5a059] text-black font-extrabold' : 'text-gray-400'}`}>
                    <Calendar className="w-3.5 h-3.5" /><span className="hidden sm:inline">Accueil / Prochain show</span><span className="sm:hidden">Accueil</span>
                  </button>
                  <button onClick={() => handleSetView('map')} className={`flex items-center gap-1 sm:gap-1.5 px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${activeView === 'map' ? 'bg-[#c5a059] text-black font-extrabold' : 'text-gray-400'}`}>
                    <MapIcon className="w-3.5 h-3.5" /><span className="hidden sm:inline">Carte interactive</span><span className="sm:hidden">Carte</span>
                  </button>
                  <button onClick={() => handleSetView('transports')} className={`flex items-center gap-1 sm:gap-1.5 px-2.5 sm:px-3 py-1.5 rounded-lg text-xs font-bold transition-all ${activeView === 'transports' ? 'bg-[#c5a059] text-black font-extrabold' : 'text-gray-400'}`}>
                    <Train className="w-3.5 h-3.5" /><span className="hidden sm:inline">Plan de route (trains & vans)</span><span className="sm:hidden">Transports</span>
                  </button>
                </div>
              </div>
            </div>

            {/* Global Search Overlay Panel */}
            {globalSearchOpen && (
              <div className="fixed top-14 sm:top-16 left-1/2 -translate-x-1/2 z-[60] bg-[#0c0c0c] border border-[#c5a059]/40 rounded-2xl shadow-2xl p-3 sm:p-4 max-w-md w-[92vw] space-y-3">
                <div className="flex items-center gap-2 bg-[#181818] border border-gray-800 px-3 py-2 rounded-xl">
                  <Search className="w-4 h-4 text-[#c5a059] shrink-0" />
                  <input
                    type="text"
                    value={globalSearchQuery}
                    onChange={(e) => setGlobalSearchQuery(e.target.value)}
                    onKeyDown={(e) => {
                      if (e.key === 'Escape') setGlobalSearchOpen(false);
                    }}
                    placeholder="Rechercher une ville, une salle..."
                    className="w-full bg-transparent text-xs text-white placeholder-gray-500 focus:outline-none"
                    autoFocus
                  />
                  <button onClick={() => { setGlobalSearchOpen(false); setGlobalSearchQuery(''); }} className="text-gray-400 hover:text-white p-0.5">
                    <X className="w-3.5 h-3.5" />
                  </button>
                </div>

                <div className="max-h-60 overflow-y-auto custom-scrollbar space-y-1.5">
                  {globalSearchQuery.trim().length > 0 && globalSearchResults.length === 0 && (
                    <p className="text-xs text-gray-500 text-center py-3">Aucun résultat trouvé.</p>
                  )}
                  {globalSearchResults.map((s) => (
                    <div
                      key={s.id}
                      onClick={() => {
                        handleSelectShow(s.id, 0);
                        setGlobalSearchOpen(false);
                        setGlobalSearchQuery('');
                      }}
                      className="bg-[#141414] hover:bg-[#1f1f1f] p-2.5 rounded-xl border border-gray-800 hover:border-[#c5a059]/50 cursor-pointer flex items-center justify-between transition-colors"
                    >
                      <div>
                        <p className="font-serif font-black text-sm text-white">{s.city}</p>
                        <p className="text-[11px] text-gray-400">{s.dates[0].venue} • {s.dates[0].date}</p>
                      </div>
                      <ArrowRight className="w-3.5 h-3.5 text-[#c5a059]" />
                    </div>
                  ))}
                </div>
              </div>
            )}
          </header>

          <main className="flex-1 min-h-0 relative overflow-hidden w-full h-full flex flex-col">
            {activeView === 'home' && (
              <HomeHeroView
                nextShow={nextShowData}
                upcomingShows={upcomingList}
                onSelectShow={handleSelectShow}
                onOpenTransports={() => handleSetView('transports')}
                onOpenMap={() => handleSetView('map')}
              />
            )}

            {activeView === 'map' && (
              <div className="flex-1 min-h-0 relative w-full h-full flex flex-col">
                <div className="flex-1 min-h-0 relative w-full h-full">
                  <InteractiveMap
                    shows={SHOWS}
                    activeShowId={activeShowId}
                    selectedLotFilter={selectedLotFilter}
                    setSelectedLotFilter={setSelectedLotFilter}
                    onSelectShow={handleSelectShow}
                    nextShowId={nextShowData.show?.id}
                  />

                  {!drawerOpen && activeShow && (
                    <div className="absolute bottom-16 sm:bottom-20 left-1/2 -translate-x-1/2 z-20 pointer-events-auto flex items-center gap-2.5 bg-[#0c0c0c] border border-[#c5a059]/60 px-3.5 py-2 rounded-2xl shadow-2xl max-w-[92vw]">
                      <div className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse shrink-0" />
                      <span className="text-xs font-bold text-gray-200 truncate">
                        {activeShow.city} • Étape #{activeShow.dates[0].order}
                      </span>
                      <button
                        onClick={() => setDrawerOpen(true)}
                        className="text-xs font-extrabold text-black bg-[#c5a059] hover:bg-[#e5c17e] px-3 py-1 rounded-xl transition-all shadow-md active:scale-95 shrink-0"
                      >
                        Voir la fiche
                      </button>
                    </div>
                  )}

                  {drawerOpen && activeShowId && (
                    <ShowDetailDrawer
                      shows={SHOWS}
                      activeShowId={activeShowId}
                      selectedSubDateIndex={selectedSubDateIndex}
                      setSelectedSubDateIndex={setSelectedSubDateIndex}
                      onClose={() => setDrawerOpen(false)}
                      permanents={PERMANENTS}
                      userRole={userRole}
                    />
                  )}
                </div>
              </div>
            )}

            {activeView === 'transports' && (
              <TransportHub
                seriesData={SERIES_LOGISTICS}
                onSelectShow={(showId) => handleSelectShow(showId, 0)}
              />
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
