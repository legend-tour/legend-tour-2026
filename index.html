    function weatherCodeToEmoji(code) {
      if (code === 0) return "☀️";
      if (code >= 1 && code <= 3) return "⛅";
      if (code === 45 || code === 48) return "🌫️";
      if (code >= 51 && code <= 67) return "🌧️";

      if (code >= 95) return "⛈️";
      return null;
    }

    function useShowWeather(lat, lon, dateISO) {
      const [weather, setWeather] = useState(null);

      useEffect(() => {
        let cancelled = false;
        if (!lat || !lon) return;
        setWeather(null);

        const fetchForecast = async () => {
          try {
            let res = null;
            if (dateISO) {
              res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=Europe/Paris&start_date=${dateISO}&end_date=${dateISO}`);
            }
            if (!res || !res.ok) {
              res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,weathercode&timezone=Europe/Paris&forecast_days=1`);
            }
            if (!res.ok) return;
            const data = await res.json();
            if (cancelled) return;
            if (data.daily && data.daily.temperature_2m_max && data.daily.temperature_2m_max.length > 0) {
              setWeather({
                max: Math.round(data.daily.temperature_2m_max[0]),
                min: Math.round(data.daily.temperature_2m_min[0]),
                code: data.daily.weathercode[0],
              });
            }
          } catch (e) {
            if (!cancelled) setWeather(null);
          }
        };

        fetchForecast();
        return () => { cancelled = true; };
      }, [lat, lon, dateISO]);

      return weather;
    }

    // --- INTERACTIVE MAP COMPONENT ---
    const BOUNDS = { minLat: 41.2, maxLat: 51.8, minLon: -5.8, maxLon: 10.8 };
    const BASE_W = 760;
    const BASE_H = 700;
    const MIN_ZOOM = 1.0;
    const MAX_ZOOM = 3.5;

    function project(lat, lon, width = 760, height = 700) {
      const margin = 0.07;
      const availableW = width * (1 - 2 * margin);
      const availableH = height * (1 - 2 * margin);

      const lonNorm = (lon - BOUNDS.minLon) / (BOUNDS.maxLon - BOUNDS.minLon);
      const latMercator = Math.log(Math.tan(Math.PI / 4 + (lat * Math.PI / 180) / 2));
      const minLatMerc = Math.log(Math.tan(Math.PI / 4 + (BOUNDS.minLat * Math.PI / 180) / 2));
      const maxLatMerc = Math.log(Math.tan(Math.PI / 4 + (BOUNDS.maxLat * Math.PI / 180) / 2));
      const latNorm = (latMercator - minLatMerc) / (maxLatMerc - minLatMerc);

      const x = width * margin + lonNorm * availableW;
      const y = height - (height * margin + latNorm * availableH);
      return { x, y };
    }

    function InteractiveMap({ shows, activeShowId, selectedLotFilter, setSelectedLotFilter, onSelectShow, nextShowId }) {
      const [zoomScale, setZoomScale] = useState(1.0);
      const [centerCoord, setCenterCoord] = useState({ x: 380, y: 350 });
      const [isPanning, setIsPanning] = useState(false);
      const [hasInteracted, setHasInteracted] = useState(false);

      const containerRef = useRef(null);
      const touchStateRef = useRef({
        mode: 'idle',
        startX: 0,
        startY: 0,
        initialDistance: 0,
        initialScale: 1.0,
        initialCenter: { x: 380, y: 350 },
        startMidpointSVG: { x: 380, y: 350 },
        lastTapTime: 0,
        movedDistance: 0,
      });

      const mouseStateRef = useRef({
        isDown: false,
        startX: 0,
        startY: 0,
        initialCenter: { x: 380, y: 350 },
        movedDistance: 0,
      });

      const clampCenter = useCallback((x, y, scale) => {
        const curW = BASE_W / scale;
        const curH = BASE_H / scale;
        const minX = curW / 2;
        const maxX = BASE_W - curW / 2;
        const minY = curH / 2;
        const maxY = BASE_H - curH / 2;

        return {
          x: Math.max(minX, Math.min(maxX, x)),
          y: Math.max(minY, Math.min(maxY, y)),
        };
      }, []);

      useEffect(() => {
        if (activeShowId) {
          const activeShow = shows.find((s) => s.id === activeShowId);
          if (activeShow) {
            const pos = project(activeShow.lat, activeShow.lon);
            const targetScale = Math.max(zoomScale, 1.4);
            setZoomScale(targetScale);
            setCenterCoord(clampCenter(pos.x, pos.y, targetScale));
          }
        }
      }, [activeShowId]);

      const handleZoomIn = () => {
        setHasInteracted(true);
        setZoomScale((prev) => {
          const next = Math.min(MAX_ZOOM, Number((prev + 0.35).toFixed(2)));
          setCenterCoord((curr) => clampCenter(curr.x, curr.y, next));
          return next;
        });
      };

      const handleZoomOut = () => {
        setHasInteracted(true);
        setZoomScale((prev) => {
          const next = Math.max(MIN_ZOOM, Number((prev - 0.35).toFixed(2)));
          setCenterCoord((curr) => clampCenter(curr.x, curr.y, next));
          return next;
        });
      };

      const handleResetZoom = () => {
        setHasInteracted(true);
        setZoomScale(1.0);
        setCenterCoord({ x: 380, y: 350 });
      };

      const handleCenterNextShow = () => {
        setHasInteracted(true);
        const nextShow = shows.find((s) => s.id === nextShowId) || shows[0];
        if (nextShow) {
          onSelectShow(nextShow.id, 0);
          const pos = project(nextShow.lat, nextShow.lon);
          setZoomScale(1.6);
          setCenterCoord(clampCenter(pos.x, pos.y, 1.6));
        }
      };

      const clientToSvgPoint = useCallback((clientX, clientY, currentScale, currentCenter) => {
        if (!containerRef.current) return { x: 380, y: 350 };
        const rect = containerRef.current.getBoundingClientRect();
        const relX = (clientX - rect.left) / rect.width;
        const relY = (clientY - rect.top) / rect.height;

        const curW = BASE_W / currentScale;
        const curH = BASE_H / currentScale;
        const curX = currentCenter.x - curW / 2;
        const curY = currentCenter.y - curH / 2;

        return {
          x: curX + relX * curW,
          y: curY + relY * curH,
        };
      }, []);

      useEffect(() => {
        const el = containerRef.current;
        if (!el) return;

        const getTouchDistance = (t1, t2) => {
          const dx = t1.clientX - t2.clientX;
          const dy = t1.clientY - t2.clientY;
          return Math.hypot(dx, dy);
        };

        const getTouchMidpoint = (t1, t2) => ({
          clientX: (t1.clientX + t2.clientX) / 2,
          clientY: (t1.clientY + t2.clientY) / 2,
        });

        const onTouchStart = (e) => {
          setHasInteracted(true);
          const now = Date.now();
          const touches = e.touches;

          if (touches.length === 1) {
            const timeDiff = now - touchStateRef.current.lastTapTime;
            if (timeDiff < 300 && touchStateRef.current.movedDistance < 10) {
              e.preventDefault();
              const tapPt = clientToSvgPoint(touches[0].clientX, touches[0].clientY, zoomScale, centerCoord);
              if (zoomScale > 1.2) {
                setZoomScale(1.0);
                setCenterCoord({ x: 380, y: 350 });
              } else {
                const nextScale = 2.2;
                setZoomScale(nextScale);
                setCenterCoord(clampCenter(tapPt.x, tapPt.y, nextScale));
              }
              touchStateRef.current.lastTapTime = 0;
              return;
            }

            touchStateRef.current.lastTapTime = now;
            touchStateRef.current.mode = 'pan';
            touchStateRef.current.startX = touches[0].clientX;
            touchStateRef.current.startY = touches[0].clientY;
            touchStateRef.current.initialCenter = { ...centerCoord };
            touchStateRef.current.movedDistance = 0;
          } else if (touches.length === 2) {
            e.preventDefault();
            touchStateRef.current.mode = 'pinch';
            touchStateRef.current.initialDistance = getTouchDistance(touches[0], touches[1]);
            touchStateRef.current.initialScale = zoomScale;
            touchStateRef.current.initialCenter = { ...centerCoord };
            const mid = getTouchMidpoint(touches[0], touches[1]);
            touchStateRef.current.startX = mid.clientX;
            touchStateRef.current.startY = mid.clientY;
            touchStateRef.current.startMidpointSVG = clientToSvgPoint(mid.clientX, mid.clientY, zoomScale, centerCoord);
            touchStateRef.current.movedDistance = 0;
            setIsPanning(true);
          }
        };

        const onTouchMove = (e) => {
          const touches = e.touches;

          if (touchStateRef.current.mode === 'pan' && touches.length === 1) {
            const dx = touches[0].clientX - touchStateRef.current.startX;
            const dy = touches[0].clientY - touchStateRef.current.startY;
            const dist = Math.hypot(dx, dy);
            touchStateRef.current.movedDistance += dist;

            if (zoomScale > 1.05 || dist > 8) {
              if (e.cancelable) e.preventDefault();
              setIsPanning(true);
              const rect = el.getBoundingClientRect();
              const svgDx = (dx / rect.width) * (BASE_W / zoomScale);
              const svgDy = (dy / rect.height) * (BASE_H / zoomScale);

              setCenterCoord(
                clampCenter(
                  touchStateRef.current.initialCenter.x - svgDx,
                  touchStateRef.current.initialCenter.y - svgDy,
                  zoomScale
                )
              );
            }

            if (e.cancelable) e.preventDefault();
            setIsPanning(true);
            const newDist = getTouchDistance(touches[0], touches[1]);
            const initialDist = touchStateRef.current.initialDistance || 1;
            const scaleMultiplier = newDist / initialDist;

            const newScale = Math.max(
              MIN_ZOOM,
              Math.min(MAX_ZOOM, touchStateRef.current.initialScale * scaleMultiplier)
            );

            const mid = getTouchMidpoint(touches[0], touches[1]);
            const rect = el.getBoundingClientRect();

            const relX = (mid.clientX - rect.left) / rect.width;
            const relY = (mid.clientY - rect.top) / rect.height;

            const curW = BASE_W / newScale;
            const curH = BASE_H / newScale;

            const focalSVG = touchStateRef.current.startMidpointSVG;
            const newCenterX = focalSVG.x - (relX - 0.5) * curW;
            const newCenterY = focalSVG.y - (relY - 0.5) * curH;

            setZoomScale(newScale);
            setCenterCoord(clampCenter(newCenterX, newCenterY, newScale));
          }
        };

        const onTouchEnd = (e) => {
          if (e.touches.length === 0) {
            touchStateRef.current.mode = 'idle';
            setIsPanning(false);
          } else if (e.touches.length === 1) {
            touchStateRef.current.mode = 'pan';
            touchStateRef.current.startX = e.touches[0].clientX;
            touchStateRef.current.startY = e.touches[0].clientY;
            touchStateRef.current.initialCenter = { ...centerCoord };
          }
        };

        const onWheel = (e) => {
          e.preventDefault();
          setHasInteracted(true);
          const zoomFactor = e.deltaY < 0 ? 1.15 : 0.87;
          const targetScale = Math.max(MIN_ZOOM, Math.min(MAX_ZOOM, zoomScale * zoomFactor));

          const focal = clientToSvgPoint(e.clientX, e.clientY, zoomScale, centerCoord);
          const rect = el.getBoundingClientRect();
          const relX = (e.clientX - rect.left) / rect.width;
          const relY = (e.clientY - rect.top) / rect.height;

          const curW = BASE_W / targetScale;
          const curH = BASE_H / targetScale;

          const newCenterX = focal.x - (relX - 0.5) * curW;
          const newCenterY = focal.y - (relY - 0.5) * curH;

          setZoomScale(targetScale);
          setCenterCoord(clampCenter(newCenterX, newCenterY, targetScale));
        };

        el.addEventListener('touchstart', onTouchStart, { passive: false });
        el.addEventListener('touchmove', onTouchMove, { passive: false });
        el.addEventListener('touchend', onTouchEnd);
        el.addEventListener('touchcancel', onTouchEnd);
        el.addEventListener('wheel', onWheel, { passive: false });

        return () => {
          el.removeEventListener('touchstart', onTouchStart);
          el.removeEventListener('touchmove', onTouchMove);
          el.removeEventListener('touchend', onTouchEnd);
          el.removeEventListener('touchcancel', onTouchEnd);
          el.removeEventListener('wheel', onWheel);
        };
      }, [zoomScale, centerCoord, clampCenter, clientToSvgPoint]);

      const handleMouseDown = (e) => {
        if (e.button !== 0) return;
        setHasInteracted(true);
        mouseStateRef.current.isDown = true;
        mouseStateRef.current.startX = e.clientX;
        mouseStateRef.current.startY = e.clientY;
        mouseStateRef.current.initialCenter = { ...centerCoord };
        mouseStateRef.current.movedDistance = 0;
      };

      const handleMouseMove = (e) => {
        if (!mouseStateRef.current.isDown || !containerRef.current) return;
        const dx = e.clientX - mouseStateRef.current.startX;
        const dy = e.clientY - mouseStateRef.current.startY;
        const dist = Math.hypot(dx, dy);
        mouseStateRef.current.movedDistance += dist;

        if (dist > 4) {
          setIsPanning(true);
          const rect = containerRef.current.getBoundingClientRect();
          const svgDx = (dx / rect.width) * (BASE_W / zoomScale);
          const svgDy = (dy / rect.height) * (BASE_H / zoomScale);

          setCenterCoord(
            clampCenter(
              mouseStateRef.current.initialCenter.x - svgDx,
              mouseStateRef.current.initialCenter.y - svgDy,
              zoomScale
            )
          );
        }
      };

      const handleMouseUp = () => {
        mouseStateRef.current.isDown = false;
        setTimeout(() => setIsPanning(false), 50);
      };

      const curW = BASE_W / zoomScale;
      const curH = BASE_H / zoomScale;
      const clamped = clampCenter(centerCoord.x, centerCoord.y, zoomScale);
      const curX = clamped.x - curW / 2;
      const curY = clamped.y - curH / 2;
      const viewBoxStr = `${curX.toFixed(1)} ${curY.toFixed(1)} ${curW.toFixed(1)} ${curH.toFixed(1)}`;

      const franceCoords = [
        [51.0, 2.5], [50.8, 1.6], [50.1, 1.5], [49.7, -1.9], [48.6, -4.7], [47.7, -3.5], [46.3, -1.4],
        [43.4, -1.8], [42.4, 3.1], [43.2, 5.4], [43.7, 7.5], [45.1, 7.0], [46.0, 6.0], [47.5, 7.5],
        [49.0, 8.2], [49.5, 6.0], [50.0, 4.8], [51.0, 2.5]
      ];

      const belgiumCoords = [
        [51.0, 2.5], [51.4, 3.3], [51.3, 5.0], [50.7, 6.0], [49.5, 6.0], [50.0, 4.8], [51.0, 2.5]
      ];

      const toPathD = (coords) => coords.map((c, i) => { const p = project(c[0], c[1]); return `${i === 0 ? 'M' : 'L'} ${p.x.toFixed(1)},${p.y.toFixed(1)}`; }).join(' ') + ' Z';

      let connectorPath = '';
      shows.forEach((show, i) => {
        const pos = project(show.lat, show.lon);
        if (i === 0) connectorPath += `M ${pos.x.toFixed(1)},${pos.y.toFixed(1)}`;
        else connectorPath += ` L ${pos.x.toFixed(1)},${pos.y.toFixed(1)}`;
      });

      const labelOffsets = {
        Toulouse: { dx: -28, dy: 6, anchor: 'end' },
        Montpellier: { dx: 0, dy: 36, anchor: 'middle' },
        'Aix-en-Provence': { dx: -22, dy: -68, anchor: 'end', isMultiline: true, line1: 'Aix-en-', line2: 'Provence' },
        Nice: { dx: 26, dy: 6, anchor: 'start' },
        Bordeaux: { dx: -28, dy: 6, anchor: 'end' },
        Nantes: { dx: -28, dy: 14, anchor: 'end' },
        Rennes: { dx: -28, dy: -12, anchor: 'end' },
        'Lyon-Décines': { dx: -28, dy: 6, anchor: 'end' },
        Chambéry: { dx: 26, dy: 14, anchor: 'start' },
        Liévin: { dx: 26, dy: 14, anchor: 'start' },
        Rouen: { dx: -26, dy: -12, anchor: 'end' },
        Dijon: { dx: 26, dy: 6, anchor: 'start' },
        Strasbourg: { dx: 24, dy: 10, anchor: 'start' },
        Metz: { dx: 24, dy: -12, anchor: 'start' },
        Bruxelles: { dx: 26, dy: -8, anchor: 'start' },
        Paris: { dx: -28, dy: 6, anchor: 'end' },
      };

      const paris = shows.find((s) => s.id === 'paris');
      const parisPos = paris ? project(paris.lat, paris.lon) : { x: 0, y: 0 };
      const zoomPercent = Math.round(zoomScale * 100);

      return (
        <div className="w-full h-full flex flex-col relative overflow-hidden bg-[#080808]">
          <div className="bg-[#0c0c0c]/90 border-b border-[#1a1a1a] p-2 sm:p-3 shrink-0 z-20 flex items-center justify-between overflow-x-auto custom-scrollbar gap-2">
            <div className="flex items-center gap-1.5 text-xs font-bold text-[#c5a059] tracking-wider shrink-0">
              <Filter className="w-3.5 h-3.5" />
              <span className="hidden sm:inline">Filtrer par série (lot) :</span>
            </div>

            <div className="flex items-center gap-1.5">
              <button onClick={() => setSelectedLotFilter('all')} className={`text-[10px] sm:text-xs font-bold py-1.5 px-3 rounded-lg uppercase shrink-0 ${selectedLotFilter === 'all' ? 'bg-[#c5a059] text-black shadow-md' : 'bg-[#181818] text-gray-300'}`}>Toutes</button>
              {[
                { num: 1, label: 'S1 Ouest' },
                { num: 2, label: 'S2 Nord' },
                { num: 3, label: 'S3 Est/Sud' },
                { num: 4, label: 'S4 Alsace/BE' },
                { num: 5, label: 'S5 Sud/Lyon' },
              ].map((item) => (
                <button key={item.num} onClick={() => setSelectedLotFilter(item.num)} className={`text-[10px] sm:text-xs font-bold py-1.5 px-2.5 rounded-lg uppercase shrink-0 ${selectedLotFilter === item.num ? 'bg-[#c5a059] text-black shadow-md' : 'bg-[#181818] text-gray-300'}`}>{item.label}</button>
              ))}
            </div>
          </div>

          <div
            ref={containerRef}
            onMouseDown={handleMouseDown}
            onMouseMove={handleMouseMove}
            onMouseUp={handleMouseUp}
            onMouseLeave={handleMouseUp}
            style={{ touchAction: 'none' }}
            className={`flex-1 min-h-0 relative flex items-center justify-center p-0 select-none overflow-hidden w-full h-full ${
              isPanning ? 'cursor-grabbing' : 'cursor-grab'
            }`}
          >
            {/* Floating Zoom & Pan Map Controls */}
            <div className="absolute top-3 right-3 z-20 flex flex-col items-end gap-1.5 pointer-events-auto">
              {zoomScale > 1.05 && (
                <button
                  onClick={handleResetZoom}
                  className="bg-[#0e0e0e]/95 border border-[#c5a059]/60 text-[#c5a059] font-extrabold text-[10px] px-2.5 py-1 rounded-lg backdrop-blur-md shadow-lg flex items-center gap-1 hover:bg-[#1a1a1a] transition-all"
                  title="Cliquer pour réinitialiser le zoom"
                >
                  <span>Zoom {zoomPercent}%</span>
                  <span className="text-gray-400 text-[9px]">✕</span>
                </button>
              )}

              <div className="bg-[#121212]/95 border border-gray-800 backdrop-blur-md p-1 rounded-xl shadow-2xl flex flex-col gap-1">
                <button
                  onClick={handleZoomIn}
                  disabled={zoomScale >= MAX_ZOOM}
                  className="p-2.5 sm:p-2 rounded-lg bg-[#181818] hover:bg-[#282828] text-gray-200 disabled:opacity-30 transition-all active:scale-90"
                  title="Zoomer (+)"
                >
                  <ZoomIn className="w-4 h-4" />
                </button>

                <button
                  onClick={handleZoomOut}
                  disabled={zoomScale <= MIN_ZOOM}
                  className="p-2.5 sm:p-2 rounded-lg bg-[#181818] hover:bg-[#282828] text-gray-200 disabled:opacity-30 transition-all active:scale-90"
                  title="Dézoomer (-)"
                >
                  <ZoomOut className="w-4 h-4" />
                </button>

                <button
                  onClick={handleResetZoom}
                  className="p-2.5 sm:p-2 rounded-lg bg-[#181818] hover:bg-[#282828] text-amber-400 hover:text-white transition-all active:scale-90"
                  title="Recadrer la carte (100%)"
                >
                  <RefreshCw className="w-4 h-4" />
                </button>
              </div>

              <button
                onClick={handleCenterNextShow}
                className="flex items-center gap-1.5 bg-[#c5a059] hover:bg-[#e5c17e] text-black font-extrabold text-[10px] px-3 py-2 sm:py-1.5 rounded-xl shadow-lg border border-white/20 transition-all active:scale-95"
              >
                <Navigation className="w-3.5 h-3.5" />
                <span className="hidden sm:inline">Centrer Prochain Show</span>
                <span className="sm:hidden">Prochain</span>
              </button>
            </div>

            {!hasInteracted && zoomScale === 1.0 && (
              <div className="absolute bottom-3 left-3 z-20 pointer-events-none flex items-center gap-2 bg-[#0c0c0c]/90 border border-gray-800 text-gray-300 text-[11px] px-3 py-1.5 rounded-xl shadow-xl backdrop-blur-md animate-pulse">
                <Hand className="w-3.5 h-3.5 text-[#c5a059]" />
                <span>Pincez avec 2 doigts pour zoomer</span>
              </div>
            )}

            <svg viewBox={viewBoxStr} preserveAspectRatio="xMidYMid meet" className="w-full h-full max-w-full max-h-full select-none relative z-10">
              <path d={toPathD(franceCoords)} fill="#0e0e0e" stroke="rgba(197, 160, 89, 0.4)" strokeWidth="2.2" />
              <path d={toPathD(belgiumCoords)} fill="#121212" stroke="rgba(197, 160, 89, 0.3)" strokeDasharray="3,3" strokeWidth="1.8" />
              <path d={connectorPath} fill="none" stroke="rgba(197, 160, 89, 0.5)" strokeWidth="2" strokeDasharray="5,4" />

              {shows.filter((s) => s.isReturnCity && s.id !== 'paris').map((show) => {
                const pos = project(show.lat, show.lon);
                const midX = (pos.x + parisPos.x) / 2;
                const midY = (pos.y + parisPos.y) / 2;
                const dx = parisPos.x - pos.x;
                const dy = parisPos.y - pos.y;
                const norm = Math.hypot(dx, dy) || 1;
                const ctrlX = midX - (dy / norm) * 30;
                const ctrlY = midY + (dx / norm) * 30;
                const arcD = `M ${pos.x},${pos.y} Q ${ctrlX},${ctrlY} ${parisPos.x},${parisPos.y}`;
                if (selectedLotFilter !== 'all' && selectedLotFilter !== show.lot) return null;
                return (
                  <g key={`arc-${show.id}`}>
                    <path d={arcD} fill="none" stroke="#3b82f6" strokeWidth="1.8" strokeDasharray="4,4" className="opacity-70" />
                    <circle r="3" fill="#3b82f6"><animateMotion path={arcD} dur="3.5s" repeatCount="indefinite" /></circle>
                  </g>
                );
              })}

              {shows.map((show) => {
                const pos = project(show.lat, show.lon);
                const offset = labelOffsets[show.city] || { dx: 28, dy: 6, anchor: 'start' };
                let orderLabel = `${show.dates[0].order}`;
                if (show.dates.length > 1) orderLabel = `${show.dates[0].order}-${show.dates[show.dates.length - 1].order}`;
                const isLotMatch = selectedLotFilter === 'all' || selectedLotFilter === show.lot;
                const isSelected = show.id === activeShowId;
                const isNextShow = show.id === nextShowId;

                return (
                  <g
                    key={`node-${show.id}`}
                    onClick={(e) => {
                      if (touchStateRef.current.movedDistance > 10 || mouseStateRef.current.movedDistance > 10) return;
                      e.stopPropagation();
                      onSelectShow(show.id, 0);
                    }}
                    className="cursor-pointer group"
                    style={{ opacity: isLotMatch ? 1 : 0.25 }}
                  >
                    <circle cx={pos.x} cy={pos.y} r="34" className="fill-transparent" />
                    <circle cx={pos.x} cy={pos.y} r="24" className={isSelected ? 'fill-[#c5a059]/20 stroke-[#c5a059] stroke-2' : 'fill-[#c5a059]/10 opacity-0 group-hover:opacity-100'} />
                    <line x1={pos.x} y1={pos.y - 10} x2={pos.x} y2={pos.y - 16} stroke="#c5a059" strokeWidth="2" opacity="0.8" />
                    <circle cx={pos.x} cy={pos.y} r="11" className={isSelected ? 'fill-[#c5a059] stroke-white stroke-[3]' : 'fill-[#080808] stroke-[#c5a059] stroke-[3] group-hover:fill-[#c5a059]'} />
                    <circle cx={pos.x} cy={pos.y} r="4" className="fill-white" />

                    <g transform={`translate(${pos.x}, ${pos.y - 28})`}>
                      <rect x={show.dates.length > 1 ? -24 : -16} y="-13" width={show.dates.length > 1 ? 48 : 32} height="26" rx="13" className={isSelected ? 'fill-[#c5a059] stroke-white stroke-[2.5]' : 'fill-[#0c0c0c] stroke-[#c5a059] stroke-[2.5]'} />
                      <text x="0" y="0.5" textAnchor="middle" dominantBaseline="central" className={isSelected ? 'fill-black font-sans font-black text-[15px]' : 'fill-[#c5a059] font-sans font-black text-[15px]'}>{orderLabel}</text>
                    </g>

                    {isNextShow && (
                      <g transform={`translate(${pos.x}, ${pos.y - 48})`}>
                        <rect x="-30" y="-8" width="60" height="16" rx="8" className="fill-amber-500 stroke-amber-300 stroke-1" />
                        <text x="0" y="0.5" textAnchor="middle" dominantBaseline="central" className="fill-black font-sans font-black text-[9px]">Prochaine</text>
                      </g>
                    )}

                    {offset.isMultiline ? (
                      <text x={pos.x + offset.dx} y={pos.y + offset.dy} textAnchor={offset.anchor} style={{ paintOrder: 'stroke fill', stroke: '#080808', strokeWidth: '7px' }} className="fill-gray-100 group-hover:fill-[#e5c17e] font-serif text-[18px] font-black tracking-wider pointer-events-none">
                        <tspan x={pos.x + offset.dx} dy="-10">{offset.line1}</tspan>
                        <tspan x={pos.x + offset.dx} dy="20">{offset.line2}</tspan>
                      </text>
                    ) : (
                      <text x={pos.x + offset.dx} y={pos.y + offset.dy} textAnchor={offset.anchor} style={{ paintOrder: 'stroke fill', stroke: '#080808', strokeWidth: '7px' }} className="fill-gray-100 group-hover:fill-[#e5c17e] font-serif text-[19px] font-black tracking-wider pointer-events-none">{show.city}</text>
                    )}
                  </g>
                );
              })}
            </svg>
          </div>
        </div>
      );
    }

    // --- SHOW DETAIL DRAWER COMPONENT ---
    function ShowDetailDrawer({ shows, activeShowId, selectedSubDateIndex, setSelectedSubDateIndex, onClose, permanents, userRole }) {
      const [activeTab, setActiveTab] = useState('exclusive');
      const [showLogisticsDetails, setShowLogisticsDetails] = useState(false);

      if (!activeShowId) return null;
      const show = shows.find((s) => s.id === activeShowId);
      if (!show) return null;

      const dateData = show.dates[selectedSubDateIndex] || show.dates[0];
      const percent = Math.round((dateData.sold / dateData.capacity) * 100);
      const weather = useShowWeather(show?.lat, show?.lon, dateData?.dateISO);

      const openDirections = () => {
        window.open(`https://www.google.com/maps/dir/?api=1&destination=${show.lat},${show.lon}`, '_blank');
      };

      const handleReportIssue = () => {
        const message = `Imprévu — ${show.city} (${dateData.date}) : `;
        const phone = (dateData.contact?.phone || "0601770676").replace(/\s/g, '');
        const url = `sms:${phone}?body=${encodeURIComponent(message)}`;
        window.location.href = url;
      };

      const downloadICS = () => {
        const escapeICS = (text) => (text || '').replace(/,/g, '\\,').replace(/;/g, '\\;');
        const startDate = new Date(`${dateData.dateISO}T${dateData.time.replace('h', ':')}:00`);
        const endDate = new Date(startDate.getTime() + 3 * 60 * 60 * 1000);
        const formatICSDate = (d) =>
          `${d.getFullYear()}${String(d.getMonth() + 1).padStart(2, '0')}${String(d.getDate()).padStart(2, '0')}T${String(d.getHours()).padStart(2, '0')}${String(d.getMinutes()).padStart(2, '0')}00`;
        const dtStart = formatICSDate(startDate);
        const dtEnd = formatICSDate(endDate);

        const icsContent = [
          'BEGIN:VCALENDAR',
          'VERSION:2.0',
          'PRODID:-//Legend Tour 2026//FR',
          'BEGIN:VEVENT',
          `SUMMARY:${escapeICS(`Legend Tour 2026 — ${show.city}`)}`,
          `LOCATION:${escapeICS(dateData.venue)}`,
          `DTSTART:${dtStart}`,
          `DTEND:${dtEnd}`,
          'BEGIN:VALARM',
          'TRIGGER:-PT2H',
          'ACTION:DISPLAY',
          'DESCRIPTION:Rappel Legend Tour 2026',
          'END:VALARM',
          'END:VEVENT',
          'END:VCALENDAR'
        ].join('\r\n');

        const blob = new Blob([icsContent], { type: 'text/calendar;charset=utf-8;' });
        const link = document.createElement('a');
        link.href = window.URL.createObjectURL(blob);
        link.setAttribute('download', `Legend_Tour_${show.city}.ics`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
      };

      return (
        <div className="fixed inset-x-0 bottom-0 z-40 max-h-[calc(100dvh-75px)] sm:max-h-[80vh] lg:max-h-none lg:inset-x-auto lg:top-16 lg:left-4 lg:bottom-4 lg:w-[420px] bg-[#0a0a0a] border-t lg:border border-[#222222] rounded-t-3xl lg:rounded-2xl flex flex-col shrink-0 shadow-2xl overflow-hidden">
          <div className="p-3 bg-[#121212] border-b border-[#222222] flex items-center justify-between shrink-0">
            <div className="flex items-center gap-2">
              <span className="text-[10px] font-bold text-[#c5a059] uppercase tracking-widest bg-[#181818] border border-[#333333] px-2.5 py-1 rounded-full">
                Étape #{dateData.order} • Série {show.series}
              </span>
              {show.dates.length > 1 && (
                <span className="text-[10px] font-bold text-amber-300 bg-amber-950/60 border border-amber-800/60 px-2 py-0.5 rounded-full">
                  Date {selectedSubDateIndex + 1}/{show.dates.length}
                </span>
              )}
            </div>
            <button onClick={onClose} className="text-xs font-bold text-gray-400 hover:text-white uppercase flex items-center gap-1 p-1 rounded-lg">
              <X className="w-4 h-4" /><span>Fermer</span>
            </button>
          </div>

          <div className="flex-1 overflow-y-auto custom-scrollbar p-4 sm:p-5 space-y-5 bg-[#0a0a0a]">
            {/* Multi-dates selection tabs (Paris & Bruxelles) */}
            {show.dates.length > 1 && (
              <div className="bg-[#141414] border border-[#2d2d2d] rounded-2xl p-3 space-y-2.5">
                <div className="flex items-center justify-between">
                  <span className="text-[10px] uppercase font-bold text-gray-400 flex items-center gap-1.5">
                    <Calendar className="w-3.5 h-3.5 text-[#c5a059]" />
                    <span>Choisir la date ({show.city}) :</span>
                  </span>
                  <span className="text-[10px] font-extrabold text-[#c5a059] bg-[#1f1a10] px-2 py-0.5 rounded-md border border-[#c5a059]/30">
                    2 représentations distinctes
                  </span>
                </div>

                <div className="grid grid-cols-2 gap-2">
                  {show.dates.map((d, index) => {
                    const isSelected = index === selectedSubDateIndex;
                    return (
                      <button
                        key={index}
                        onClick={() => setSelectedSubDateIndex(index)}
                        className={`p-2.5 rounded-xl border text-left transition-all ${
                          isSelected
                            ? 'bg-[#c5a059] text-black border-[#c5a059] shadow-lg'
                            : 'bg-[#181818] text-gray-300 border-[#262626] hover:border-gray-600 hover:bg-[#202020]'
                        }`}
                      >
                        <div className="flex items-center justify-between">
                          <span className={`text-[9px] font-extrabold uppercase px-1.5 py-0.5 rounded ${
                            isSelected ? 'bg-black text-[#c5a059]' : 'bg-[#252525] text-[#c5a059]'
                          }`}>
                            Étape #{d.order}
                          </span>
                          <span className={`text-[10px] font-bold ${isSelected ? 'text-black' : 'text-amber-400'}`}>
                            {d.time}
                          </span>
                        </div>
                        <p className={`text-xs font-black mt-1.5 ${isSelected ? 'text-black' : 'text-white'}`}>
                          {d.date}
                        </p>
                        <p className={`text-[10px] mt-0.5 truncate font-semibold ${isSelected ? 'text-black/80' : 'text-gray-400'}`}>
                          {d.guests.length > 0 ? `${d.guests.length} invité${d.guests.length > 1 ? 's' : ''}` : 'Sans invité ponctuel'}
                        </p>
                      </button>
                    );
                  })}
                </div>
              </div>
            )}

            <div className="bg-[#121212] border border-[#222222] rounded-2xl p-4 space-y-4">
              <div className="flex items-start justify-between border-b border-[#222222] pb-3">
                <div>
                  <span className="text-[10px] font-bold text-[#c5a059] tracking-wider block mb-1">
                    Série {show.series} {show.dates.length > 1 ? `• Représentation ${selectedSubDateIndex + 1}/${show.dates.length}` : ''}
                  </span>
                  <h2 className="font-serif text-2xl font-black text-white">{show.city}</h2>
                </div>
                <div className="text-right">
                  <p className="text-xs font-extrabold text-[#c5a059]">{dateData.date}</p>
                  <p className="text-xs text-gray-300 font-bold mt-0.5 flex items-center justify-end gap-1">
                    <Clock className="w-3 h-3 text-amber-500" />{dateData.time}
                  </p>
                </div>
              </div>

              <div className="space-y-3">
                <div className="flex items-center justify-between bg-[#181818] p-2.5 rounded-xl border border-[#262626]">
                  <div className="flex items-center gap-3">
                    <MapPin className="w-5 h-5 text-[#c5a059] shrink-0" />
                    <div>
                      <p className="text-[9px] uppercase text-gray-400 font-bold">Salle</p>
                      <p className="text-xs text-gray-100 font-bold">{dateData.venue}</p>
                    </div>
                  </div>
                  {weather && (
                    <span className="text-xs text-gray-300 font-medium ml-auto shrink-0">
                      {weatherCodeToEmoji(weather.code)} {weather.min}° / {weather.max}°
                    </span>
                  )}
                </div>

                <div className="flex items-center gap-3 bg-[#181818] p-2.5 rounded-xl border border-[#262626]">
                  <Train className="w-4 h-4 text-[#c5a059] shrink-0" />
                  <div>
                    <p className="text-[9px] uppercase text-gray-400 font-bold">Transport prévu</p>
                    <p className="text-xs text-gray-200 font-bold">{show.transport}</p>
                  </div>
                </div>

                <div className="bg-[#161616] p-3 rounded-xl border border-[#262626] space-y-2">
                  <div className="flex justify-between text-[10px]">
                    <span className="font-bold text-gray-400 uppercase">Remplissage (au 04/09/2026)</span>
                    <span className="font-extrabold text-[#c5a059]">{percent}%</span>
                  </div>
                  <div className="w-full bg-[#080808] h-2.5 rounded-full overflow-hidden border border-[#222222]">
                    <div className="bg-gradient-to-r from-[#8e6f3b] to-[#c5a059] h-full rounded-full" style={{ width: `${percent}%` }} />
                  </div>
                  <div className="flex justify-between items-center text-[11px] text-gray-300 font-medium">
                    <span>{dateData.sold.toLocaleString('fr-FR')} / {dateData.capacity.toLocaleString('fr-FR')} places</span>
                    <span className={dateData.capacity - dateData.sold <= 50 ? "text-emerald-400 font-extrabold text-[10.5px]" : "text-amber-400/90 font-semibold text-[10.5px]"}>
                      {dateData.capacity - dateData.sold <= 0 ? "Complet (100%)" : `${(dateData.capacity - dateData.sold).toLocaleString('fr-FR')} restantes`}
                    </span>
                  </div>
                </div>

                <button onClick={openDirections} className="w-full flex items-center justify-center gap-2 bg-[#181818] border border-[#c5a059] text-white py-3 px-4 rounded-xl text-xs font-extrabold">

                          <p className="font-mono text-xs text-gray-200 select-text">PASS: {dateData.wifiBackstage.password}</p>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            </div>

            <div className="space-y-3">
              <div className="flex border-b border-[#222222]">
                <button onClick={() => setActiveTab('exclusive')} className={`flex-1 pb-3 text-center text-xs font-bold border-b-2 ${activeTab === 'exclusive' ? 'border-[#c5a059] text-[#c5a059]' : 'border-transparent text-gray-400'}`}>Invités d'honneur</button>
                <button onClick={() => setActiveTab('permanents')} className={`flex-1 pb-3 text-center text-xs font-bold border-b-2 ${activeTab === 'permanents' ? 'border-[#c5a059] text-[#c5a059]' : 'border-transparent text-gray-400'}`}>Intervenants permanents</button>
              </div>

              {activeTab === 'exclusive' && (
                <div className="space-y-3">
                  {show.dates.length > 1 && (
                    <div className="bg-[#141414] p-1.5 rounded-xl border border-[#262626] space-y-1">
                      <p className="text-[9px] uppercase text-gray-400 font-bold px-1">Sélectionner la date des invités :</p>
                      <div className="flex gap-1.5">
                        {show.dates.map((d, index) => (
                          <button
                            key={index}
                            onClick={() => setSelectedSubDateIndex(index)}
                            className={`flex-1 py-1.5 px-2 rounded-lg text-[10px] font-bold transition-all flex items-center justify-center gap-1.5 ${
                              index === selectedSubDateIndex
                                ? 'bg-[#c5a059] text-black shadow-sm font-extrabold'

                            <span>{d.date.split(' ')[0]} {d.date.split(' ')[1]}</span>
                            <span className={`text-[9px] px-1.5 py-0.2 rounded-full font-extrabold ${
                              index === selectedSubDateIndex ? 'bg-black/20 text-black' : 'bg-[#262626] text-[#c5a059]'
                            }`}>

                            </span>
                          </button>
                        ))}
                      </div>
                    </div>
                  )}

                  <div className="flex items-center justify-between text-[11px] px-1">
                    <span className="text-gray-300 font-medium">
                      Date : <strong className="text-white">{dateData.date}</strong> (Étape #{dateData.order})
                    </span>
                    <span className="text-[#c5a059] font-bold text-[10px]">
                      {dateData.guests.length} {dateData.guests.length > 1 ? 'invités' : dateData.guests.length === 1 ? 'invité' : 'invité ponctuel'}
                    </span>

                  <div className="space-y-2">
                    {dateData.guests.length === 0 ? (
                      <div className="bg-[#141414] border border-[#262626] rounded-xl p-4 text-center space-y-1">
                        <p className="text-xs text-gray-300 font-medium">Pas d'invité ponctuel annoncé pour cette date.</p>
                        <p className="text-[10px] text-gray-500">Seuls les intervenants permanents sont programmés pour cette représentation.</p>
                      </div>
                    ) : (
                      dateData.guests.map((g, idx) => (
                        <div key={idx} className="bg-[#141414] border border-[#262626] hover:border-[#c5a059]/40 p-3 rounded-xl flex items-center justify-between transition-colors">

                            <div className="w-2 h-2 rounded-full bg-[#c5a059]" />
                            <span className="text-xs font-bold text-white">{g}</span>
                          </div>
                          <div className="flex items-center gap-1 bg-[#1f1a10] border border-[#c5a059]/30 px-2 py-0.5 rounded-md">

    }

    // --- TRANSPORT HUB COMPONENT ---
    function TransportHub({ seriesData, onSelectShow }) {
      const [selectedSeriesId, setSelectedSeriesId] = useState('all');
      const [modeFilter, setModeFilter] = useState('all');
      const [searchQuery, setSearchQuery] = useState('');
      const [copied, setCopied] = useState(false);

      const getFilteredLegs = () => {
        let allLegs = [];
        seriesData.forEach((s) => {
          if (selectedSeriesId === 'all' || s.seriesId === selectedSeriesId) {
            s.legs.forEach((l) => allLegs.push({ series: s, leg: l }));
          }
        });
        if (modeFilter !== 'all') {
          if (modeFilter === 'avion' || modeFilter === 'plane') {
            allLegs = allLegs.filter((i) => i.leg.mode === 'avion' || i.leg.mode === 'plane');
          } else {
            allLegs = allLegs.filter((i) => i.leg.mode === modeFilter);
          }
        }
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase().trim();
          allLegs = allLegs.filter((i) => i.leg.from.toLowerCase().includes(q) || i.leg.to.toLowerCase().includes(q) || i.leg.details.toLowerCase().includes(q));
        }
        return allLegs;
      };

      const filteredItems = getFilteredLegs();

      const handleCopySchedule = () => {
        let text = "Plan de Route & Transports — Legend Tour 2026\n\n";
        seriesData.forEach((s) => {
          text += `=== ${s.title} (${s.datesRange}) ===\n`;
          s.legs.forEach((leg) => {
            const modeLabel = (leg.mode === 'plane' || leg.mode === 'avion') ? 'AVION' : leg.mode ? leg.mode.toUpperCase() : '';
            text += `${leg.date} | ${leg.from} -> ${leg.to}${leg.mode && leg.mode !== 'local' && leg.mode !== 'car' ? ` | Mode: ${modeLabel}` : ''} | ${leg.details}\n`;
          });
          text += "\n";
        });
        navigator.clipboard.writeText(text);
        setCopied(true);
        setTimeout(() => setCopied(false), 3000);
      };

      return (
        <div className="flex-1 min-h-0 flex flex-col bg-[#080808] text-gray-100 overflow-y-auto custom-scrollbar p-3 sm:p-6 space-y-6">
          <div className="bg-[#121212] border border-[#222] rounded-2xl p-4 sm:p-6 box-glow-gold space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-3 border-b border-gray-800 pb-4">
              <div>
                <span className="text-[10px] font-bold text-[#c5a059] tracking-widest bg-[#181818] border border-[#c5a059]/30 px-3 py-1 rounded-full uppercase">Document officiel de route</span>
                <h2 className="font-serif text-2xl sm:text-3xl font-black text-white mt-2">Plan de route & transports (Séries 1 à 6)</h2>
                <p className="text-xs text-gray-400 mt-1">Suivi détaillé des TGV, gares de départ/arrivée, vans et jours OFF.</p>
              </div>
              <button onClick={handleCopySchedule} className="flex items-center gap-2 bg-[#181818] border border-[#c5a059]/50 text-[#c5a059] px-4 py-2.5 rounded-xl text-xs font-bold">
                {copied ? <Check className="w-4 h-4 text-emerald-400" /> : <Copy className="w-4 h-4" />}
                <span>{copied ? 'Feuille copiée !' : 'Copier le planning'}</span>
              </button>
            </div>

            <div className="flex items-center gap-2 overflow-x-auto custom-scrollbar pb-1">
              <button onClick={() => setSelectedSeriesId('all')} className={`py-2 px-3.5 rounded-xl text-xs font-bold ${selectedSeriesId === 'all' ? 'bg-[#c5a059] text-black' : 'bg-[#181818] text-gray-300'}`}>Toutes les séries</button>
              {seriesData.map((s) => (
                <button key={s.seriesId} onClick={() => setSelectedSeriesId(s.seriesId)} className={`py-2 px-3.5 rounded-xl text-xs font-bold uppercase shrink-0 ${selectedSeriesId === s.seriesId ? 'bg-[#c5a059] text-black' : 'bg-[#181818] text-gray-300'}`}>Série {s.seriesId}</button>
              ))}
            </div>

            <div className="flex flex-wrap items-center justify-between gap-3 pt-2 bg-[#0a0a0a] p-3 rounded-xl border border-gray-800">
              <div className="flex items-center gap-2 flex-wrap">
                <button onClick={() => setModeFilter('all')} className={`text-[10px] font-bold px-2.5 py-1 rounded-lg uppercase ${modeFilter === 'all' ? 'bg-[#c5a059] text-black' : 'bg-[#181818] text-gray-400'}`}>Tous</button>
                <button onClick={() => setModeFilter('train')} className={`text-[10px] font-bold px-2.5 py-1 rounded-lg uppercase ${modeFilter === 'train' ? 'bg-purple-500 text-white' : 'bg-[#181818] text-gray-400'}`}>Trains</button>
                <button onClick={() => setModeFilter('van')} className={`text-[10px] font-bold px-2.5 py-1 rounded-lg uppercase ${modeFilter === 'van' ? 'bg-amber-500 text-black' : 'bg-[#181818] text-gray-400'}`}>Vans</button>
                <button onClick={() => setModeFilter('avion')} className={`text-[10px] font-bold px-2.5 py-1 rounded-lg uppercase ${modeFilter === 'avion' ? 'bg-sky-500 text-white' : 'bg-[#181818] text-gray-400'}`}>Avions</button>
              </div>
              <input type="text" value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)} placeholder="Chercher gare, ville, N° TGV..." className="bg-[#141414] text-xs text-gray-200 px-3 py-1.5 rounded-lg border border-gray-800" />
            </div>
          </div>

          <div className="space-y-4">
            {filteredItems.map(({ series, leg }) => {
              return (
                <div key={leg.id} className="bg-[#121212] border border-gray-800 rounded-2xl p-4 space-y-3">
                  <div className="flex items-center justify-between border-b border-gray-800 pb-2">
                    <div className="flex items-center gap-2 flex-wrap">
                      <span className="text-xs font-extrabold text-white bg-[#181818] px-3 py-1 rounded-lg border border-gray-800">{leg.date}</span>
                      {leg.legType && (
                        <span className={`text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-md ${
                          leg.legType === 'ALLER' ? 'bg-blue-950 text-blue-300 border border-blue-800' :
                          leg.legType === 'RETOUR' ? 'bg-rose-950 text-rose-300 border border-rose-800' :
                          'bg-amber-950 text-amber-300 border border-amber-800'
                        }`}>
                          {leg.legType}
                        </span>
                      )}
                      {leg.mode && leg.mode !== 'local' && leg.mode !== 'car' && (
                        <span className={`text-[10px] font-extrabold uppercase px-2.5 py-1 rounded-full ${
                          leg.mode === 'train' ? 'bg-purple-950 text-purple-300 border border-purple-800' :
                          (leg.mode === 'van' || leg.mode === 'bus') ? 'bg-amber-950 text-amber-300 border border-amber-800' :
                          (leg.mode === 'avion' || leg.mode === 'plane') ? 'bg-sky-950 text-sky-300 border border-sky-800' :
                          'bg-[#202020] text-gray-300 border border-gray-700'
                        }`}>
                          {(leg.mode === 'avion' || leg.mode === 'plane') ? 'AVION' : (leg.mode === 'bus' ? 'BUS PROD' : leg.mode.toUpperCase())}
                        </span>
                      )}
                      {leg.duration && (
                        <span className="text-[10px] text-gray-400 font-medium flex items-center gap-1">
                          <Clock className="w-3 h-3 text-[#c5a059]" />{leg.duration}
                        </span>
                      )}
                    </div>
                    {leg.relatedShowId && (
                      <button onClick={() => onSelectShow(leg.relatedShowId)} className="text-[10px] font-bold text-[#c5a059] flex items-center gap-1 bg-[#181818] px-2.5 py-1 rounded-lg border border-[#c5a059]/30">
                        <span>Fiche Show</span><ArrowRight className="w-3 h-3" />
                      </button>
                    )}
                  </div>

                  <div className="flex items-center gap-2 text-sm font-serif font-black text-white">
                    <span>{leg.from}</span><ArrowRight className="w-4 h-4 text-[#c5a059]" /><span>{leg.to}</span>
                  </div>
                  <p className="text-xs text-[#c5a059] font-bold">{leg.details}</p>

                  {leg.traveler && (
                    <div className="flex items-center gap-2 text-[11px] text-gray-300">
                      <span className="text-gray-500 font-bold uppercase text-[9px]">Voyageur :</span>
                      <span className="font-semibold text-white">{leg.traveler}</span>
                      {leg.pax && <span className="text-[10px] text-gray-400">({leg.pax} pers.)</span>}
                    </div>
                  )}

                  {leg.notes && (
                    <p className="text-[11px] text-gray-400 italic bg-[#141414] p-2 rounded-lg border border-[#222]">
                      💡 {leg.notes}
                    </p>
                  )}

                  <div className="bg-[#161616] p-3 rounded-xl border border-gray-800 space-y-2 text-xs">
                    {leg.trainNumber && (

                      <div className="bg-black/40 p-2.5 rounded-lg space-y-1">

                        {leg.mode === 'train' && (
                          <a href={`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(leg.arrivalStation || leg.to)}`} target="_blank" rel="noopener noreferrer" className="flex items-center justify-center gap-1.5 bg-[#222] hover:bg-[#333] text-gray-200 py-1.5 px-2.5 rounded-lg text-[11px] font-bold border border-gray-700 mt-1">

    // --- MAIN APP COMPONENT ---
    function App() {
      const [isUnlocked, setIsUnlocked] = useState(false);
      const [accessCodeInput, setAccessCodeInput] = useState('');
      const [accessError, setAccessError] = useState(false);

      const [activeView, setActiveView] = useState('home');
      const [userRole, setUserRole] = useState('artiste');
      const [activeShowId, setActiveShowId] = useState('bordeaux');
      const [selectedSubDateIndex, setSelectedSubDateIndex] = useState(0);
      const [selectedLotFilter, setSelectedLotFilter] = useState('all');
      const [drawerOpen, setDrawerOpen] = useState(true);

      const [globalSearchOpen, setGlobalSearchOpen] = useState(false);
      const [globalSearchQuery, setGlobalSearchQuery] = useState('');

      useEffect(() => {
        if (sessionStorage.getItem('legend_tour_unlocked') === 'true') {
          setIsUnlocked(true);
        }
      }, []);

      const handleUnlock = () => {
        if (accessCodeInput.trim() === ACCESS_CODE) {
          sessionStorage.setItem('legend_tour_unlocked', 'true');
          setIsUnlocked(true);
          setAccessError(false);
        } else {
          setAccessError(true);
        }
      };

      const getNextShow = () => {
        const todayStr = new Date().toISOString().split('T')[0];
        const upcoming = [];
        SHOWS.forEach((show) => {
          show.dates.forEach((d, idx) => {
            if (d.dateISO >= todayStr) upcoming.push({ show, dateEntry: d, subDateIndex: idx });
          });
        });
        upcoming.sort((a, b) => a.dateEntry.dateISO.localeCompare(b.dateEntry.dateISO));
        if (upcoming.length > 0) return { ...upcoming[0], isFinished: false };
        const lastShow = SHOWS[SHOWS.length - 1];
        return { show: lastShow, dateEntry: lastShow.dates[lastShow.dates.length - 1], subDateIndex: lastShow.dates.length - 1, isFinished: true };
      };

      const getUpcomingShows = (count = 3) => {
        const todayStr = new Date().toISOString().split('T')[0];
        const upcoming = [];
        SHOWS.forEach((show) => {
          show.dates.forEach((d, idx) => {
            if (d.dateISO >= todayStr) upcoming.push({ show, dateEntry: d, subDateIndex: idx });
          });
        });
        upcoming.sort((a, b) => a.dateEntry.dateISO.localeCompare(b.dateEntry.dateISO));
        return upcoming.slice(0, count);
      };

      const nextShowData = getNextShow();
      const upcomingList = getUpcomingShows(3);

      useEffect(() => {
        if (nextShowData.show) {
          setActiveShowId(nextShowData.show.id);
          setSelectedSubDateIndex(nextShowData.subDateIndex);
        }
      }, []);

      const handleSetView = (view) => {
        if (view === 'map') setDrawerOpen(false);
        setActiveView(view);
      };

      const handleSelectShow = (showId, subDateIndex = 0) => {
        setActiveShowId(showId);
        setSelectedSubDateIndex(subDateIndex);
        setDrawerOpen(true);
        setActiveView('map');
      };

      const activeShow = SHOWS.find((s) => s.id === activeShowId);
      const [searchCategory, setSearchCategory] = useState('all');

      function normalizeSearch(str) {
        return (str || '')
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLowerCase()
          .trim();
      }

      // Enhanced global search across Guests, Permanents, Cities and Venues
      const globalSearchResults = useMemo(() => {
        const cleanQ = normalizeSearch(globalSearchQuery);
        if (!cleanQ) return { guests: [], permanents: [], shows: [], total: 0 };
        const tokens = cleanQ.split(/\s+/).filter(Boolean);

        // 1. Extract and match Guests from shows
        const guestMap = new Map();
        SHOWS.forEach((s) => {
          s.dates.forEach((d, subIdx) => {
            (d.guests || []).forEach((gName) => {
              const trimmed = gName.trim();
              if (!trimmed) return;
              if (!guestMap.has(trimmed)) guestMap.set(trimmed, []);
              guestMap.get(trimmed).push({
                show: s,
                dateEntry: d,
                subDateIndex: subIdx,
                allGuests: d.guests
              });
            });
          });
        });

        const matchedGuests = [];
        guestMap.forEach((apps, gName) => {
          const normName = normalizeSearch(gName);
          const nameMatches = tokens.every((t) => normName.includes(t));
          const matchingApps = apps.filter((app) => {
            const c = normalizeSearch(app.show.city);
            const v = normalizeSearch(app.dateEntry.venue);
            const d = normalizeSearch(app.dateEntry.date);
            return nameMatches || tokens.every((t) => c.includes(t) || v.includes(t) || d.includes(t));
          });
          if (nameMatches || matchingApps.length > 0) {
            matchedGuests.push({
              name: gName,
              appearances: nameMatches ? apps : matchingApps,
              totalCount: apps.length
            });
          }
        });

        // 2. Match Permanent Intervenants
        const matchedPermanents = (PERMANENTS || []).filter((p) => {
          const n = normalizeSearch(p.name);
          const r = normalizeSearch(p.role);
          const d = normalizeSearch(p.desc);
          return tokens.every((t) => n.includes(t) || r.includes(t) || d.includes(t));
        });

        // 3. Match Shows & Venues
        const matchedShows = [];
        SHOWS.forEach((s) => {
          s.dates.forEach((d, subIdx) => {
            const c = normalizeSearch(s.city);
            const v = normalizeSearch(d.venue);
            const dt = normalizeSearch(d.date);
            if (tokens.every((t) => c.includes(t) || v.includes(t) || dt.includes(t))) {
              matchedShows.push({ show: s, subDateIndex: subIdx, dateEntry: d });
            }
          });
        });

        return {
          guests: matchedGuests,
          permanents: matchedPermanents,
          shows: matchedShows,
          total: matchedGuests.length + matchedPermanents.length + matchedShows.length
        };
      }, [globalSearchQuery]);

                                  </div>
                                  <div>
                                    <h4 className="text-sm sm:text-base font-serif font-black text-white flex items-center gap-2">
                                      <span>{g.name}</span>
                                      <span className="text-[10px] font-sans font-bold bg-[#221c10] border border-[#c5a059]/40 text-[#c5a059] px-2 py-0.5 rounded-full">
                                        Invité d'honneur
                                      </span>
                                    </h4>
                                    <p className="text-[11px] text-gray-400">
                                      {g.totalCount === 18 ? 'Présente sur l\'ensemble de la tournée (18 shows)' : `Présent sur ${g.totalCount} date${g.totalCount > 1 ? 's' : ''}`}
                                    </p>
                                  </div>
                                </div>
                              </div>
                              <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1 border-t border-gray-800/80">
                                {g.appearances.map((app) => (
                                  <button
                                    key={`${app.show.id}-${app.subDateIndex}`}
                                    onClick={() => {
                                      handleSelectShow(app.show.id, app.subDateIndex);
                                      setGlobalSearchOpen(false);
                                      setGlobalSearchQuery('');
                                    }}
                                    className="text-left bg-[#1a1a1a] hover:bg-[#252525] border border-gray-800/80 hover:border-[#c5a059]/60 p-2.5 rounded-xl transition-all group flex items-center justify-between"
                                  >
                                    <div className="min-w-0 pr-2">
                                      <div className="flex items-center gap-1.5">
                                        <span className="text-xs font-black text-white group-hover:text-[#c5a059] transition-colors truncate">
                                          {app.show.city}
                                        </span>
                                        <span className="text-[9px] font-bold text-gray-500">#{app.dateEntry.order}</span>
                                      </div>
                                      <p className="text-[10px] text-gray-400 truncate">{app.dateEntry.date} • {app.dateEntry.venue}</p>
                                    </div>
                                    <ArrowRight className="w-4 h-4 text-gray-500 group-hover:text-[#c5a059] shrink-0" />
                                  </button>
                                ))}
                              </div>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* Matched Permanents */}
                    {globalSearchQuery.trim() && (searchCategory === 'all' || searchCategory === 'permanents') && globalSearchResults.permanents.length > 0 && (
                      <div className="space-y-2.5">
                        <div className="flex items-center gap-2 text-xs font-extrabold uppercase tracking-wider text-blue-400">
                          <Users className="w-3.5 h-3.5" />
                          <span>Intervenants permanents trouvés ({globalSearchResults.permanents.length})</span>
                        </div>
                        <div className="space-y-2">
                          {globalSearchResults.permanents.map((p) => (
                            <div key={p.name} className="bg-[#141414] border border-blue-900/40 rounded-2xl p-3.5 space-y-1.5">
                              <div className="flex items-start justify-between">
                                <div>
                                  <h4 className="text-sm font-bold text-white">{p.name}</h4>
                                  <p className="text-xs text-[#c5a059] font-medium">{p.role}</p>
                                </div>
                                <span className="text-[10px] text-emerald-400 font-bold bg-emerald-950/60 border border-emerald-800/60 px-2 py-0.5 rounded">
                                  Toutes les dates
                                </span>
                              </div>
                              <p className="text-xs text-gray-400 leading-relaxed">{p.desc}</p>
                            </div>
                          ))}
                        </div>
                      </div>
                    )}

                    {/* Matched Shows */}
                    {globalSearchQuery.trim() && (searchCategory === 'all' || searchCategory === 'cities') && globalSearchResults.shows.length > 0 && (
                      <div className="space-y-2.5">
                        <div className="flex items-center gap-2 text-xs font-extrabold uppercase tracking-wider text-emerald-400">
                          <MapPin className="w-3.5 h-3.5" />
                          <span>Villes & Salles ({globalSearchResults.shows.length})</span>
                        </div>
                        <div className="space-y-2">
                          {globalSearchResults.shows.map(({ show, subDateIndex, dateEntry }) => (
                            <div
                              key={`${show.id}-${subDateIndex}`}
                              onClick={() => {
                                handleSelectShow(show.id, subDateIndex);
                                setGlobalSearchOpen(false);
                                setGlobalSearchQuery('');
                              }}
                              className="bg-[#141414] hover:bg-[#1a1a1a] border border-gray-800 hover:border-[#c5a059]/60 p-3 rounded-xl cursor-pointer transition-all flex items-center justify-between group"
                            >
                              <div className="space-y-1 min-w-0 pr-3">
                                <div className="flex items-center gap-2">
                                  <span className="font-serif font-black text-sm text-white group-hover:text-[#c5a059] transition-colors">{show.city}</span>
                                  <span className="text-[10px] text-[#c5a059] font-bold bg-[#221c10] border border-[#c5a059]/30 px-2 py-0.5 rounded-full">Étape #{dateEntry.order}</span>
                                </div>
                                <p className="text-xs text-gray-300">{dateEntry.venue} • {dateEntry.date} ({dateEntry.time})</p>
                                {dateEntry.guests.length > 0 && (
                                  <p className="text-[11px] text-amber-300/90 font-medium truncate flex items-center gap-1">
                                    <Sparkles className="w-3 h-3 text-[#c5a059] shrink-0" />
                                    <span>Invités : {dateEntry.guests.join(', ')}</span>
                                  </p>
                                )}
                              </div>
                              <ArrowRight className="w-4 h-4 text-[#c5a059] group-hover:translate-x-0.5 transition-all shrink-0" />
                            </div>
                          ))}
                        </div>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}
          </header>

          <main className="flex-1 min-h-0 relative overflow-hidden w-full h-full flex flex-col">
            {activeView === 'home' && (
              <HomeHeroView
                nextShow={nextShowData}
                upcomingShows={upcomingList}
                onSelectShow={handleSelectShow}
                onOpenTransports={() => handleSetView('transports')}
                onOpenMap={() => handleSetView('map')}
              />
            )}

            {activeView === 'map' && (
              <div className="flex-1 min-h-0 relative w-full h-full flex flex-col">
                <div className="flex-1 min-h-0 relative w-full h-full">
                  <InteractiveMap
                    shows={SHOWS}
                    activeShowId={activeShowId}
                    selectedLotFilter={selectedLotFilter}
                    setSelectedLotFilter={setSelectedLotFilter}
                    onSelectShow={handleSelectShow}
                    nextShowId={nextShowData.show?.id}
                  />

                  {drawerOpen && activeShowId && (
                    <ShowDetailDrawer
                      shows={SHOWS}
                      activeShowId={activeShowId}
                      selectedSubDateIndex={selectedSubDateIndex}
                      setSelectedSubDateIndex={setSelectedSubDateIndex}
                      onClose={() => setDrawerOpen(false)}
                      permanents={PERMANENTS}
                      userRole={userRole}
                    />
                  )}
                </div>
              </div>
            )}

            {activeView === 'transports' && (
              <TransportHub
                seriesData={SERIES_LOGISTICS}
                onSelectShow={(showId) => handleSelectShow(showId, 0)}
              />
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
