    function HomeHeroView({ nextShow, onOpenShow }) {
      const show = nextShow.show;
      const dateInfo = nextShow.subDate;

      return (
        <div className="flex-1 p-4 sm:p-8 flex flex-col items-center justify-center max-w-4xl mx-auto text-center space-y-6">
          <div className="bg-[#111111] border border-gray-800/80 rounded-3xl p-6 sm:p-8 shadow-2xl w-full space-y-6 relative overflow-hidden">
            <div className="inline-flex items-center gap-2 bg-[#1c1c1c] border border-[#c5a059]/40 px-3.5 py-1.5 rounded-full text-xs font-bold text-[#c5a059]">
              <Clock className="w-3.5 h-3.5" />
              <span>Prochain spectacle de la tournée</span>
            </div>

            <div className="space-y-2">
              <h2 className="text-3xl sm:text-5xl font-black font-serif text-white">{show.city}</h2>
              <p className="text-lg text-[#c5a059] font-bold">{dateInfo.venue}</p>
              <p className="text-sm text-gray-400 font-medium">{dateInfo.date} • {dateInfo.time}</p>
            </div>

            <div className="flex flex-col sm:flex-row items-center justify-center gap-3 pt-2">
              <button onClick={() => onOpenShow(show.id)} className="w-full sm:w-auto bg-[#c5a059] hover:bg-[#d4b06a] text-black font-bold px-6 py-3 rounded-xl text-xs uppercase tracking-wider flex items-center justify-center gap-2 transition-all">
                <span>Consulter la fiche complète</span>
                <ArrowRight className="w-4 h-4" />
              </button>

              {show.transport && (show.transport.toLowerCase().includes('train') || show.transport.toLowerCase().includes('tgv')) && (
                <a href={`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(`Gare de ${show.city}`)}`} target="_blank" rel="noopener noreferrer" className="w-full sm:w-auto bg-purple-950/80 hover:bg-purple-900 border border-purple-800 text-purple-200 px-5 py-3 rounded-xl text-xs font-bold flex items-center justify-center gap-2 transition-all">
                  <Train className="w-4 h-4 text-purple-400"/>
                  <span>Itinéraire vers la gare de {show.city}</span>
                  <ExternalLink className="w-3 h-3 text-purple-300"/>
                </a>
              )}
            </div>

            <div className="border-t border-gray-800/80 pt-4 mt-4 grid grid-cols-1 sm:grid-cols-2 gap-3 text-left text-xs bg-black/40 p-4 rounded-2xl">
              <div>
                <p className="text-[10px] text-gray-500 uppercase font-bold">Régisseur général</p>
                <p className="font-bold text-white text-sm">{dateInfo.contact.name}</p>
                <p className="text-[#c5a059] font-bold mt-0.5">{dateInfo.contact.phone}</p>
              </div>
              <div>
                <p className="text-[10px] text-gray-500 uppercase font-bold">Invités spéciaux</p>
                <p className="font-bold text-gray-200">{dateInfo.guests.join(', ')}</p>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // --- COMPOSANT TRANSPORTS HUB ---
    function TransportHub({ seriesData, onSelectShow }) {
      return (
        <div className="flex-1 p-4 sm:p-6 space-y-6 max-w-5xl mx-auto w-full">
          <div className="bg-[#111111] border border-gray-800 rounded-2xl p-5 space-y-3">
            <h2 className="text-xl font-bold font-serif text-white">Plan de route & transports</h2>
            <p className="text-xs text-gray-400">Itinéraires des gares de départ, gares d'arrivée et suivi logistique des TGV.</p>
          </div>

          <div className="space-y-4">
            {seriesData.map((series) => (
              <div key={series.seriesId} className="bg-[#111111] border border-gray-800/80 rounded-2xl p-4 space-y-3">
                <h3 className="text-md font-bold text-[#c5a059]">{series.title} — {series.subtitle}</h3>

                <div className="space-y-3">
                  {series.legs.map((leg) => (
                    <div key={leg.id} className="bg-[#161616] border border-gray-800 p-4 rounded-xl space-y-3 text-xs">
                      <div className="flex justify-between items-center border-b border-gray-800 pb-2">
                        <span className="font-bold text-[#c5a059]">{leg.date} • {leg.details}</span>
                        {leg.duration && <span className="text-gray-400">{leg.duration}</span>}
                      </div>

                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                        <div className="bg-black/50 p-3 rounded-lg space-y-2">
                          <p className="text-[10px] text-gray-400 uppercase font-bold">Départ</p>
                          <p className="font-bold text-white">{leg.departureStation || leg.from}</p>
                          {leg.mode === 'train' && (
                            <a href={`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(leg.departureStation || leg.from)}`} target="_blank" rel="noopener noreferrer" className="flex items-center justify-center gap-1.5 bg-purple-900/60 hover:bg-purple-800 text-purple-100 py-1.5 px-2.5 rounded-lg text-[11px] font-bold border border-purple-700/60">
                              <Navigation className="w-3 h-3"/><span>Itinéraire gare de départ</span><ExternalLink className="w-2.5 h-2.5"/>
                            </a>
                          )}
                        </div>

                        <div className="bg-black/50 p-3 rounded-lg space-y-2">
                          <p className="text-[10px] text-gray-400 uppercase font-bold">Arrivée</p>
                          <p className="font-bold text-white">{leg.arrivalStation || leg.to}</p>
                          {leg.mode === 'train' && (
                            <a href={`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(leg.arrivalStation || leg.to)}`} target="_blank" rel="noopener noreferrer" className="flex items-center justify-center gap-1.5 bg-[#222] hover:bg-[#333] text-gray-200 py-1.5 px-2.5 rounded-lg text-[11px] font-bold border border-gray-700">
                              <MapPin className="w-3 h-3 text-[#c5a059]"/><span>Itinéraire gare d'arrivée</span><ExternalLink className="w-2.5 h-2.5"/>
                            </a>
                          )}
                        </div>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    }

    // --- APPLICATION PRINCIPALE ---
    function App() {
      const [activeView, setActiveView] = useState('home');
      const [selectedShowId, setSelectedShowId] = useState(null);

      const nextShow = useMemo(() => ({ show: SHOWS[0], subDate: SHOWS[0].dates[0] }), []);

      return (
        <div className="min-h-screen flex flex-col bg-[#080808]">
          <Header activeView={activeView} setActiveView={setActiveView} />

          <main className="flex-1 flex flex-col">
            {activeView === 'home' && <HomeHeroView nextShow={nextShow} onOpenShow={(id) => setSelectedShowId(id)} />}
            {activeView === 'transports' && <TransportHub seriesData={SERIES_LOGISTICS} onSelectShow={(id) => setSelectedShowId(id)} />}
            {activeView === 'map' && (
              <div className="flex-1 p-8 text-center text-gray-400">
                <h2 className="text-xl font-bold text-white mb-2">Carte interactive de la tournée</h2>
                <p className="text-sm">Sélectionnez le plan de route ou l'accueil pour accéder aux détails des gares et spectacles.</p>
              </div>
            )}
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
